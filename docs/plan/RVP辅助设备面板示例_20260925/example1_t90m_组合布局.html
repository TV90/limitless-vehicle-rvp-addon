<!doctype html>
<!--
  RVP 辅助设备面板 示例1：T-90M 组合布局（定版方向：A+B 结合）
  数据来源：limitless_vehicle/rvp/data/rvp/vehicles/t90m.json
    - ERA：16 块（车体侧 ERA0-5 / 炮塔 ERA6-9 / 炮塔侧 ERA10-11 / 炮塔后 ERA12 / 首上 ERA13-15）
    - ECM 主动：ecm_bone（ammo_jam_radius 250）
    - 烟幕弹：smoke total 4 / per_round 2 / burst 2 / reload 250t
    - 无 APS / DIRCM / 维修配置 → 面板不出现对应行（"无设备不画"门控演示）
  本页为设计稿：数值为演示硬编码；正式版由 Java 注入真实数据，并改用 <translation> 语言键。
-->
<html>
<head>
    <meta charset="utf-8">
    <meta name="aui-font-mode" content="web">
    <meta name="aui-viewport" content="mode=browser">
    <link rel="stylesheet" href="ore.css">
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        .equip-screen { color: var(--ore-ink); background: var(--ore-canvas); display: flex; flex-direction: column; font-family: OreRegular, "Microsoft YaHei"; }
        .equip-screen .navbar { min-height: 38px; padding: 6px 10px; flex: 0 0 auto; align-items: center; display: flex; justify-content: space-between; }
        .equip-screen .navbar-brand, .equip-screen .card-header, .equip-screen .button { font-family: OreDisplay, "Microsoft YaHei"; }
        .equip-screen .navbar-brand { font-size: 18px; }
        .nav-right { display: flex; align-items: center; gap: 10px; }
        .hp-text { font-size: 12px; color: var(--ore-ink-muted); }
        .hp-bar { width: 150px; height: 10px; background: #26272a; border: 1px solid var(--ore-edge); box-sizing: border-box; }
        .hp-fill { height: 100%; background: var(--ore-success); }
        .equip-screen .close-button { width: 30px; height: 26px; min-height: 26px; padding: 3px 7px 7px; font-size: 14px; line-height: 1; flex: 0 0 30px; }

        .equip-workspace { display: flex; gap: 7px; padding: 7px; min-height: 0; flex: 1 1 auto; }
        .skeleton-panel { flex: 0 0 44%; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
        .device-column { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 7px; }
        .equip-screen .card-header { min-height: 30px; padding: 8px 9px; font-size: 12px; flex: 0 0 auto; }
        .equip-screen .card-body { padding: 7px; }
        .dev-card { display: flex; flex-direction: column; min-height: 0; }
        .dev-card .card-body { display: flex; flex-direction: column; gap: 6px; }

        /* 设备行 */
        .dev-row { display: flex; align-items: center; gap: 8px; min-height: 26px; font-size: 15px; }
        .dev-dot { width: 10px; height: 10px; flex: 0 0 10px; border: 1px solid #141517; box-sizing: border-box; }
        .dot-ok { background: var(--ore-success); }
        .dot-warn { background: var(--ore-warning); }
        .dot-bad { background: var(--ore-danger); }
        .dot-off { background: #3a3b3e; }
        .dev-value { margin-left: auto; flex: 0 0 auto; color: var(--ore-ink-muted); font-size: 13px; }
        .dev-sub { font-size: 11px; color: var(--ore-ink-muted); padding-left: 18px; line-height: 1.35; }
        .cellbar { display: flex; gap: 1px; flex: 0 0 auto; }
        .cell { width: 9px; height: 12px; background: #2c2d30; border: 1px solid #141517; box-sizing: border-box; }
        .cell.ok { background: var(--ore-success); }
        .cell.warn { background: var(--ore-warning); }
        .cell.bad { background: var(--ore-danger); }

        /* 部件血量芯片 */
        .chip-row { display: flex; flex-wrap: wrap; gap: 4px; }
        .part-chip { font-size: 12px; padding: 3px 7px; border: 1px solid var(--ore-edge); background: #33353a; color: var(--ore-ink); }
        .part-chip b { font-weight: normal; }
        .part-chip.ok b { color: var(--ore-success); }
        .part-chip.warn b { color: var(--ore-warning); }
        .part-chip.bad b { color: var(--ore-danger); }

        /* 骨架俯视图（CSS 示意；正式版坐标来自 resolveBoneObbs 投影注入） */
        .skeleton-stage-wrap { position: relative; flex: 1 1 auto; background: #252628; border: 2px solid #56585b; box-shadow: inset 3px 3px #222325, inset -3px -3px #444649; overflow: hidden; }
        .skeleton-stage { position: absolute; left: 50%; top: 50%; width: 360px; height: 480px; margin: -240px 0 0 -180px; }
        .track { position: absolute; background: #2e2f33; border: 2px solid #45474c; box-sizing: border-box; }
        .hull { position: absolute; background: #3b3d42; border: 2px solid #55575c; box-sizing: border-box; }
        .turret-box { position: absolute; background: #43454b; border: 2px solid #5d5f65; box-sizing: border-box; }
        .barrel { position: absolute; background: #4a4c52; border: 1px solid #5d5f65; box-sizing: border-box; }
        .era { position: absolute; box-sizing: border-box; border: 1px solid #141517; background: var(--ore-success); opacity: 0.92; }
        .era.dead { background: var(--ore-danger); opacity: 0.45; }
        .sk-label { position: absolute; font-size: 10px; color: var(--ore-ink-muted); }
        .sk-legend { position: absolute; left: 10px; bottom: 8px; display: flex; gap: 12px; font-size: 10px; color: var(--ore-ink-muted); }
        .sk-legend i { display: inline-block; width: 9px; height: 9px; border: 1px solid #141517; box-sizing: border-box; vertical-align: -1px; margin-right: 3px; }
    </style>
</head>
<body class="ore-theme equip-screen">
    <nav class="navbar">
        <div class="navbar-brand">辅助设备 · T-90M</div>
        <div class="nav-right">
            <span class="hp-text">车体 1042/1200</span>
            <div class="hp-bar"><div class="hp-fill" style="width:87%"></div></div>
            <button class="close-button button button-danger" type="button">X</button>
        </div>
    </nav>
    <main class="equip-workspace">
        <!-- 左：骨架俯视图（ERA 16 块；红=已失效） -->
        <aside class="card card-accent-green skeleton-panel">
            <div class="card-header" style="background:#1e3a2e; border-left:3px solid #4caf50">骨架俯视 · 爆反状态 13/16</div>
            <div class="card-body skeleton-stage-wrap">
                <div class="skeleton-stage">
                    <div class="sk-label" style="left:158px; top:6px">▲ 车首</div>
                    <!-- 履带 / 车体 -->
                    <div class="track" style="left:74px;  top:70px; width:30px; height:340px"></div>
                    <div class="track" style="left:256px; top:70px; width:30px; height:340px"></div>
                    <div class="hull"  style="left:104px; top:70px; width:152px; height:340px"></div>
                    <!-- 首上爆反 ERA13-15 -->
                    <div class="era dead" style="left:108px; top:76px; width:44px; height:16px"></div>
                    <div class="era"      style="left:158px; top:76px; width:44px; height:16px"></div>
                    <div class="era"      style="left:208px; top:76px; width:44px; height:16px"></div>
                    <!-- 车体侧爆反 ERA0-2（左） ERA3-5（右） -->
                    <div class="era" style="left:90px;  top:150px; width:14px; height:44px"></div>
                    <div class="era" style="left:90px;  top:250px; width:14px; height:44px"></div>
                    <div class="era" style="left:90px;  top:350px; width:14px; height:44px"></div>
                    <div class="era dead" style="left:256px; top:150px; width:14px; height:44px"></div>
                    <div class="era"      style="left:256px; top:250px; width:14px; height:44px"></div>
                    <div class="era"      style="left:256px; top:350px; width:14px; height:44px"></div>
                    <!-- 炮塔 / 主炮 -->
                    <div class="barrel"    style="left:172px; top:128px; width:16px; height:52px"></div>
                    <div class="turret-box" style="left:136px; top:180px; width:88px; height:120px"></div>
                    <!-- 炮塔爆反 ERA6-9（前二/后二） -->
                    <div class="era"      style="left:140px; top:174px; width:16px; height:10px"></div>
                    <div class="era dead" style="left:204px; top:174px; width:16px; height:10px"></div>
                    <div class="era"      style="left:140px; top:296px; width:16px; height:10px"></div>
                    <div class="era"      style="left:204px; top:296px; width:16px; height:10px"></div>
                    <!-- 炮塔侧爆反 ERA10-11 / 炮塔后爆反 ERA12 -->
                    <div class="era" style="left:130px; top:205px; width:10px; height:70px"></div>
                    <div class="era" style="left:220px; top:205px; width:10px; height:70px"></div>
                    <div class="era" style="left:158px; top:308px; width:44px; height:12px"></div>
                    <!-- 分组标签 -->
                    <div class="sk-label" style="left:8px;   top:104px">首上爆反</div>
                    <div class="sk-label" style="left:310px; top:236px">车体侧</div>
                    <div class="sk-label" style="left:236px; top:186px">炮塔</div>
                    <!-- 图例 -->
                    <div class="sk-legend">
                        <span><i style="background:var(--ore-success)"></i>完好</span>
                        <span><i style="background:var(--ore-danger);opacity:.5"></i>失效</span>
                    </div>
                </div>
            </div>
        </aside>
        <!-- 右：车辆状态 + 设备列表 -->
        <div class="device-column">
            <section class="card card-accent-gold dev-card" style="flex:0 0 auto">
                <div class="card-header">部件状态</div>
                <div class="card-body">
                    <div class="chip-row">
                        <span class="part-chip ok">炮塔 <b>94%</b></span>
                        <span class="part-chip ok">车体 <b>100%</b></span>
                        <span class="part-chip warn">履带 <b>61%</b></span>
                        <span class="part-chip ok">发动机 <b>87%</b></span>
                        <span class="part-chip ok">武器站 <b>100%</b></span>
                    </div>
                </div>
            </section>
            <section class="card card-accent-green dev-card" style="flex:1 1 auto">
                <div class="card-header" style="background:#1e3a2e; border-left:3px solid #4caf50">辅助设备</div>
                <div class="card-body">
                    <div class="dev-row">
                        <span class="dev-dot dot-ok"></span><span>ECM 主动干扰</span>
                        <span class="badge badge-success">干扰中</span>
                        <span class="dev-value">剩余 18s</span>
                    </div>
                    <div class="dev-sub">对弹药干扰半径 250 格</div>
                    <div class="dev-row" style="margin-top:4px">
                        <span class="dev-dot dot-ok"></span><span>烟幕弹发射器</span>
                        <span class="cellbar"><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span></span>
                        <span class="dev-value">4/4</span>
                    </div>
                    <div class="dev-sub">每轮 2 发 · 连射 2 轮 · 装填 12.5s</div>
                    <div class="dev-row" style="margin-top:4px">
                        <span class="dev-dot dot-warn"></span><span>爆反装甲 (ERA)</span>
                        <span class="dev-value" style="color:var(--ore-warning)">13/16 失效 3</span>
                    </div>
                    <div class="cellbar" style="flex-wrap:wrap; width:160px">
                        <span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell bad"></span>
                        <span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell bad"></span>
                        <span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span>
                        <span class="cell ok"></span><span class="cell bad"></span><span class="cell ok"></span><span class="cell ok"></span>
                    </div>
                    <div class="dev-sub">失效：ERA3 车体侧 · ERA7 炮塔 · ERA13 首上</div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
