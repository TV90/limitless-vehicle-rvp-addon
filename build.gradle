plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run/client_1')
            jvmArgs "-Xmx4g"
            args '--username', 'dev1'
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        client2 {
            parent minecraft.runs.client
            inheritArgs = false
            workingDirectory project.file('run/client_2')
            jvmArgs "-Xmx4g"
            args '--username', 'dev2',
                    '--launchTarget', 'forgeclientuserdev',
                    '--version', 'MOD_DEV',
                    '--assetIndex', '5',
                    '--assetsDir', 'C:\\Users\\MECHREVO\\.gradle\\caches\\forge_gradle\\assets',
                    '--gameDir', '.',
                    '--fml.forgeVersion', '47.4.13',
                    '--fml.mcVersion', '1.20.1',
                    '--fml.forgeGroup', 'net.minecraftforge',
                    '--fml.mcpVersion', '20230612.114412'
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            workingDirectory project.file('run/server')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// RVP 载具包仅维护在 run/client_1/limitless_vehicle/rvp（不再从 src/main/resources/rvp 同步）

tasks.named('compileJava').configure {
    // clean + FROM-CACHE can skip writing build/classes and breaks dev run (NoClassDefFoundError).
    outputs.cacheIf { false }
}

['runClient', 'runClient2', 'runServer', 'runGameTestServer', 'runData'].each { taskName ->
    tasks.matching { it.name == taskName }.configureEach {
        dependsOn 'classes'
    }
}

repositories {
    maven { name = 'AliyunPublic'; url = 'https://maven.aliyun.com/repository/public' }
    maven { name = 'AliyunCentral'; url = 'https://maven.aliyun.com/repository/central' }
    mavenCentral()
    flatDir {
        dir 'libs'
    }
    maven {
        url = 'https://maven.sighs.cc/repository/maven-public/'
        content {
            includeGroup 'com.sighs'
        }
    }
    maven {
        url = "https://repo.spongepowered.org/repository/maven-public/"
        content {
            includeGroupByRegex "org\\.spongepowered.*"
        }
    }
    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.mcmodderanchor"
        }
    }
    // Distant Horizons 官方 API 发布在 Modrinth Maven；仅用于编译可选客户端兼容层。
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    // DH 矩阵字段映射测试在测试运行期构造官方 API 值对象；不会进入发布 jar。
    testImplementation "maven.modrinth:Xs0XTOVv:GgrzKRsK"
    // 手动虚拟飞行测试使用 XChart 按 Tick 绘制实时轨迹，不进入模组运行时依赖。
    testImplementation 'org.knowm.xchart:xchart:3.8.8'
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // 本体
    implementation fg.deobf("libs:ywzj_vehicle-1.20.1:0.5.10-all")
    // ApricityUI（本体 AUI 适配后 VehicleModdingToolScreen 继承了 ApricityScreen，编译+dev 运行时需要；
    // 版本随本体 jarJar 的 AUI 版本对齐，当前本体 0.5.10 内嵌 1.2.4）。
    // 必须 fg.deobf：maven 工件是生产版 SRG 映射 jar，直接进 dev 运行时会
    // NoSuchMethodError(MenuScreens.m_96206_) → DeferredWorkQueue 崩溃（2026-09-07）；
    // 仅 compileOnly 时 fg.deobf 的本体 all jar 不把 jarJar 内嵌 AUI 解到 dev 类路径，
    // EventSubclassTransformer 解析 ApricityScreen 父类失败 → CONSTRUCT 崩溃。
    // 正式环境不嵌入（无 jarJar），AUI 仍由本体 jarJar 提供。
    implementation fg.deobf('com.sighs:ApricityUI-forge-1.20.1:1.2.4')
    // sbw（联动兼容层：仅编译期引用，运行时由用户另行安装，不打包、不强制依赖。
    // 注：本体用 CurseMaven 的 modCompileOnly 接入，但 RVP 的 ForgeGradle 未注册该方法，
    // 故改用本地 libs 下 SBW jar + compileOnly fg.deobf 等价接入（SBW 同样不被嵌入、可选）。
    // 全部 SBW 类引用必须位于 RVP_SuperbWarfareCompat.isLoaded() 之后的方法体内，
    // 卸载 SBW 时不会触发 SBW 类加载，RVP 仍可正常游玩）
    compileOnly fg.deobf("libs:superbwarfare-1.20.1:0.8.9.1-all")
    // 编译使用官方 API 7.0.0 工件；运行时最低要求已验证的 API 7.0.1（DH 3.2.0-b）。
    // 桥只调用 7.0 公共事件/渲染接口，并在运行期按 major/minor/patch 校验兼容范围。
    compileOnly fg.deobf("maven.modrinth:Xs0XTOVv:GgrzKRsK")
    // SBM
    jarJar(implementation(fg.deobf("com.github.mcmodderanchor:simplebedrockmodel:2.5.1-forge-mc1.20.1"))) {
        jarJar.ranged(it, "[2.5.1,)")
    }
    compileOnly("com.maydaymemory:mae:1.1.2") {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
        exclude group: 'org.joml', module: 'joml'
    }
    // MixinExtras 注解：运行时由 Forge 47 自带 0.3.6（无需打包进 jar），仅编译期引用
    compileOnly("io.github.llamalad7:mixinextras-common:0.3.6")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'MixinConfigs'            : "${mod_id}.mixins.json",
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.register('reobfJarNamed', Copy) {
    dependsOn 'reobfJar'
    from("$buildDir/reobfJar/output.jar")
    into("$buildDir/libs/reobf")
    rename { "${mod_id}-${minecraft_version}-${mod_version}-reobf.jar" }
}

tasks.register('reobfJarJarNamed', Copy) {
    dependsOn 'reobfJarJar'
    from("$buildDir/libs/${mod_id}-${minecraft_version}-${mod_version}-all.jar")
    into("$buildDir/libs/reobf")
    rename { "${mod_id}-${minecraft_version}-${mod_version}-reobf-all.jar" }
}

tasks.matching { it.name == 'reobfJar' }.configureEach {
    finalizedBy tasks.named('reobfJarNamed')
}

tasks.matching { it.name == 'reobfJarJar' }.configureEach {
    finalizedBy tasks.named('reobfJarJarNamed')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

mixin {
    config 'ywzj_rvp.mixins.json'
    add sourceSets.main, "ywzj_rvp.refmap.json"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('test', Test).configure {
    // 带窗口的长航程仿真只通过 manualTrajectoryTest 显式运行。
    useJUnitPlatform {
        excludeTags 'manual'
    }
}

tasks.register('manualTrajectoryTest', Test) {
    description = '运行带 XChart 实时轨迹窗口的手动虚拟飞行测试。'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // 手动可视化任务每次调用都必须重新执行，不能被 Gradle 的 UP-TO-DATE 跳过。
    outputs.upToDateWhen { false }
    useJUnitPlatform {
        includeTags 'manual'
    }
    // 每 Tick 留出少量绘制时间，并在结束后短暂停留以便观察最终轨迹。
    systemProperty 'rvp.trajectoryChart.tickDelayMillis',
            System.getProperty('rvp.trajectoryChart.tickDelayMillis', '1')
    systemProperty 'rvp.trajectoryChart.finalHoldMillis',
            System.getProperty('rvp.trajectoryChart.finalHoldMillis', '10000')
}
