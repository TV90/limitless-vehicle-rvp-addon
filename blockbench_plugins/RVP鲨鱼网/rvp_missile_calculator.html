<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RVP鲨鱼网</title>
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --line:#dfe4ea; --ink:#1c2733; --sub:#66788c;
  --acc:#1a73e8; --acc2:#0b57d0; --warn:#c5221f; --ok:#188038;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header .logo{font-size:18px}
header h1{font-size:15px;margin:0 10px 0 0;font-weight:600}
button{font:inherit;padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;color:var(--ink)}
button:hover{border-color:var(--acc);color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.primary:hover{background:var(--acc2)}
button:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=number]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input[type=number]{width:100%}
#dirLabel{color:var(--sub);font-size:12px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#wrap{flex:1;display:flex;min-height:0}
aside{width:292px;min-width:292px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:12px}
aside h2{font-size:13px;margin:14px 0 8px;color:var(--acc2);border-bottom:1px dashed var(--line);padding-bottom:4px}
aside h2:first-child{margin-top:0}
.field{margin-bottom:8px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
.field input:disabled{background:#eef1f5;color:#9aa7b5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:11px;color:var(--sub);margin:6px 0 0}
#missileInfo{font-size:12px;background:#f8fafc;border:1px solid var(--line);border-radius:6px;padding:8px;white-space:pre-wrap}
#loadInfo{font-size:12px;margin-top:8px}
#loadInfo .err{color:var(--warn)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#timelineBar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#scrub{flex:1;accent-color:var(--acc)}
#timeLabel{font-variant-numeric:tabular-nums;min-width:120px;text-align:right}
#hitLabel{color:var(--ok);font-weight:600;min-width:130px}
#chartArea{flex:1;position:relative;min-height:0}
canvas#chart{position:absolute;inset:0;width:100%;height:100%;display:block}
#tooltip{position:absolute;pointer-events:none;background:rgba(21,46,80,.94);color:#fff;padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.55;display:none;z-index:5;white-space:pre;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#statusBar{padding:4px 14px;font-size:12px;color:var(--sub);background:var(--panel);border-top:1px solid var(--line)}
#legend{position:absolute;top:8px;right:12px;font-size:12px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
#legend .sw{display:inline-block;width:18px;height:0;border-top:3px solid;margin:0 4px 2px 8px;vertical-align:middle}
#curveBox{position:absolute;top:8px;left:12px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;display:none;z-index:4;line-height:1.9;max-width:340px}
#curveBox label{margin-right:10px;white-space:nowrap}
</style>
</head>
<body>
<header>
  <span class="logo">🦈</span><h1>RVP 导弹计算器</h1>
  <button id="pickDir" class="primary">选择工作目录</button>
  <span id="dirLabel">未选择目录（读取 rvp:missile JSON；已内置 3 枚示例弹可直接互比）</span>
  <button id="loadDemo">载入示例弹</button>
  <div id="selftest" style="display:none;font:12px monospace;color:#188038"></div>
  <input type="text" id="search" placeholder="搜索导弹…" style="width:150px">
  <select id="missileSelect" style="max-width:260px"><option value="">— 请先选择工作目录 —</option></select>
  <button id="cmpBtn" disabled title="把当前导弹加入同图对比（最多 4 枚，共享当前场景参数）">加入对比</button>
  <select id="viewMode">
    <option value="side">侧视图（前向×高度）</option>
    <option value="top">顶视图（前向×横向）</option>
    <option value="speed">速度剖面（前向×速度）</option>
    <option value="curves">曲线视图（时间序列）</option>
    <option value="3d">三维视图（等轴测）</option>
  </select>
  <label style="font-size:12px;color:var(--sub)"><input type="checkbox" id="equalAspect" checked> 等比例 1:1</label>
  <label style="font-size:12px;color:var(--sub)"><input type="checkbox" id="flyLabel" checked> 飞行标签</label>
  <label style="font-size:12px;color:var(--sub)">视角旋转 <input type="range" id="viewYaw" min="0" max="360" value="35" style="width:90px;vertical-align:middle"></label>
  <label style="font-size:12px;color:var(--sub)">缩放 <input type="range" id="viewZoom" min="0.5" max="3" step="0.1" value="1" style="width:90px;vertical-align:middle"></label>
</header>
<div id="wrap">
  <aside>
    <h2>场景预设</h2>
    <div class="field"><select id="presetSel">
      <option value="">— 一键填入典型交战场景 —</option>
      <option value="bvrHead">超视距 · 迎头（高空 3 km）</option>
      <option value="bvrTail">超视距 · 尾追（高空 1.5 km）</option>
      <option value="wvr">格斗 · 迎头（低空 800 m）</option>
      <option value="offAxis">偏轴机动（-27° 方位，目标 4G 转弯）</option>
    </select></div>
    <h2>发射参数</h2>
    <div class="field"><label>载机速度（公里/小时，仅 inherit_vehicle_velocity 导弹生效）</label><input type="number" id="carrierSpeed" value="0" step="50"></div>
    <div class="field"><label>地面高度（MC 世界 Y，默认 -64=世界底；主世界海平面约 63）</label><input type="number" id="groundY" value="-64" step="1"></div>
    <div class="field"><label>发射高度（MC 世界 Y，1.20.1 上限 320）</label><input type="number" id="launchAlt" value="200" step="10" min="-64" max="320"></div>
    <div class="row2">
      <div class="field"><label>发射角度（度，仰角为正）</label><input type="number" id="launchAngle" value="0" step="1"></div>
      <div class="field"><label>发射偏航角（度）</label><input type="number" id="launchYaw" value="0" step="1"></div>
    </div>
    <h2>目标参数</h2>
    <div class="field"><label><input type="checkbox" id="targetOn" checked> 启用目标交战（关闭则纯直飞弹道）</label></div>
    <div class="row2">
      <div class="field"><label>目标速度（公里/小时）</label><input type="number" id="tgtSpeed" value="100" step="50"></div>
      <div class="field"><label>目标高度（MC 世界 Y）</label><input type="number" id="tgtAlt" value="200" step="10" min="-64" max="320"></div>
    </div>
    <div class="row2">
      <div class="field"><label>初始目标距离（米）</label><input type="number" id="tgtDist" value="1000" step="100"></div>
      <div class="field"><label>目标方位角（度，相对发射航向）</label><input type="number" id="tgtBearing" value="0" step="1"></div>
    </div>
    <div class="field"><label>目标航向（度，0=迎头直奔发射点）</label><input type="number" id="tgtHeading" value="0" step="1"></div>
    <div class="row2">
      <div class="field"><label>目标垂直航向（度，正=爬升）</label><input type="number" id="tgtClimb" value="0" step="1"></div>
      <div class="field"><label>目标恒定G转弯（G，正=左转）</label><input type="number" id="tgtTurnG" value="0" step="0.5"></div>
    </div>
    <div class="field"><label>目标尺寸半径（米，等效载具 OBB，命中判定用）</label><input type="number" id="tgtRadius" value="3" step="0.5"></div>
    <div class="field"><label>模拟上限（秒）</label><input type="number" id="maxSeconds" value="240" step="30"></div>
    <h2>导弹摘要</h2>
    <div id="missileInfo">尚未加载导弹。</div>
    <div id="loadInfo"></div>
    <p class="hint">动力学内核按 RVP 实体链逐 Tick 移植：攻角模型 / 变质量推进 / 速度平方阻力 / 高度阻力表 / 二脉冲 / 诱导阻力。已知简化见同目录 README.md。</p>
  </aside>
  <main>
    <div id="timelineBar">
      <button id="btnReset" title="回到起点">⟲</button>
      <button id="btnPlay" class="primary" title="播放/暂停">▶</button>
      <button id="btnStep" title="单步（1 Tick）">⏭</button>
      <input type="range" id="scrub" min="0" max="0" value="0">
      <span id="timeLabel">0.00s / 0.00s</span>
      <span id="hitLabel"></span>
      <select id="playSpeed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1× 实时</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
        <option value="16">16×</option>
      </select>
    </div>
    <div id="chartArea">
      <canvas id="chart"></canvas>
      <div id="tooltip"></div>
      <div id="legend">
        <span style="color:#1a73e8"><span class="sw" style="border-color:#1a73e8"></span>导弹</span>
        <span style="color:#c5221f"><span class="sw" style="border-color:#c5221f"></span>目标</span>
      </div>
      <div id="curveBox">
        <b>曲线元素（X=时间，各序列独立归一化，图例标量程）</b><br>
        <label><input type="checkbox" id="cb_speed" checked> 速度 km/h</label>
        <label><input type="checkbox" id="cb_mach"> 马赫</label>
        <label><input type="checkbox" id="cb_alt" checked> 高度 m</label>
        <label><input type="checkbox" id="cb_distT" checked> 到目标距离 m</label><br>
        <label><input type="checkbox" id="cb_nG"> 当前过载 G</label>
        <label><input type="checkbox" id="cb_alpha"> 攻角 °</label>
        <label><input type="checkbox" id="cb_availG"> 可用最大过载 G</label><br>
        <label><input type="checkbox" id="cb_thrust"> 推力 N</label>
        <label><input type="checkbox" id="cb_drag"> 阻力 N</label>
        <label><input type="checkbox" id="cb_mass"> 质量 kg</label>
      </div>
    </div>
    <div id="statusBar">就绪。① 选择工作目录 ② 选导弹 ③ 点播放；悬停图表查看逐 Tick 遥测。</div>
  </main>
</div>
<input type="file" id="dirFallback" webkitdirectory multiple style="display:none">
<script>
"use strict";
/* ============================================================
 * RVP 导弹计算器 —— 动力学内核按 RVP 实体链逐 Tick 移植。
 * 依据（本仓库源码）：RVP_AttackAngleModel / RVP_AeroSteeringModel /
 * RVP_PropulsionMath / RVP_QuadraticAirDrag / RVP_ProjectileMotion /
 * RVP_ProjectileData / RVP_GuidanceRuntimeMath。
 * 单位：内部一律 格/Tick（1 格/Tick = 20 m/s = 72 km/h）；G = 0.0245 格/Tick²。
 * ============================================================ */

/* ---------- 向量 ---------- */
class V3 {
  constructor(x,y,z){ this.x=x||0; this.y=y||0; this.z=z||0; }
  add(v){ return new V3(this.x+v.x,this.y+v.y,this.z+v.z); }
  sub(v){ return new V3(this.x-v.x,this.y-v.y,this.z-v.z); }
  scale(s){ return new V3(this.x*s,this.y*s,this.z*s); }
  len(){ return Math.sqrt(this.x*this.x+this.y*this.y+this.z*this.z); }
  norm(){ const l=this.len(); return l>1e-12?this.scale(1/l):new V3(0,0,0); }
  dot(v){ return this.x*v.x+this.y*v.y+this.z*v.z; }
  cross(v){ return new V3(this.y*v.z-this.z*v.y,this.z*v.x-this.x*v.z,this.x*v.y-this.y*v.x); }
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rad=d=>d*Math.PI/180;
function angleBetween(a,b){ return Math.acos(clamp(a.norm().dot(b.norm()),-1,1)); }
/** 移植 RVP_BallisticTrajectoryMath.slerpDirection：单位向量球面插值，反向不坍缩。 */
function slerpDir(a,b,t){
  a=a.norm(); b=b.norm();
  const d=clamp(a.dot(b),-1,1), ang=Math.acos(d);
  if(ang<1e-9) return a;
  if(Math.PI-ang<1e-6){
    const orth=Math.abs(a.x)<0.9?new V3(1,0,0):new V3(0,1,0);
    const axis=a.cross(orth).norm();
    const ca=Math.cos(t*Math.PI), sa=Math.sin(t*Math.PI);
    return a.scale(ca).add(axis.cross(a).scale(sa)).norm();
  }
  const s=Math.sin(ang);
  return a.scale(Math.sin((1-t)*ang)/s).add(b.scale(Math.sin(t*ang)/s)).norm();
}
function segPointDist(a,b,p){
  const abx=b.x-a.x,aby=b.y-a.y,abz=b.z-a.z;
  const l2=abx*abx+aby*aby+abz*abz;
  let t=l2>1e-18?((p.x-a.x)*abx+(p.y-a.y)*aby+(p.z-a.z)*abz)/l2:0;
  t=Math.max(0,Math.min(1,t));
  const cx=a.x+abx*t-p.x,cy=a.y+aby*t-p.y,cz=a.z+abz*t-p.z;
  return Math.sqrt(cx*cx+cy*cy+cz*cz);
}
/** 高度分层极速倍率（无默认表）：未配置/空表/未命中/非法 → 1.0。 */
function maxSpeedFactorAt(y,map){
  if(map==null||map.length===0) return 1.0;
  const v=sampleRangeMap(map,y);
  return (v!=null&&isFinite(v)&&v>0)?v:1.0;
}
/** 比例引导：二次方程解相遇时间 t，返回指向预测拦截点的期望方向（未归一化）。
 * 逐式移植 RVP_GuidanceRuntimeMath.steerPredictiveIntercept 的解算核（含线性退化与闭速回退）。 */
function pipDesired(pos,vel,tgtPos,tgtVel){
  const speed=vel.len();
  if(speed<=1e-8) return null;
  const rel=tgtPos.sub(pos);
  const a=tgtVel.dot(tgtVel)-vel.dot(vel);
  const b=2*rel.dot(tgtVel);
  const c=rel.dot(rel);
  let t=-1;
  if(Math.abs(a)<1e-8){ if(b<0) t=-c/b; }
  else{
    const disc=b*b-4*a*c;
    if(disc>=0){
      const sq=Math.sqrt(disc);
      const t1=(-b+sq)/(2*a), t2=(-b-sq)/(2*a);
      if(t1>0&&t2>0) t=Math.min(t1,t2); else t=Math.max(t1,t2);
    }
  }
  if(t<=0){
    const relVel=tgtVel.sub(vel);
    const closing=speed-relVel.dot(rel.norm());
    t=rel.len()/Math.max(closing,0.1);
  }
  return tgtPos.add(tgtVel.scale(t)).sub(pos);
}
function dirFromPitchYaw(pitchDeg,yawRad){
  const p=rad(pitchDeg);
  return new V3(Math.cos(p)*Math.cos(yawRad),Math.sin(p),Math.cos(p)*Math.sin(yawRad)).norm();
}

/* ---------- 常量与单位 ---------- */
const G_CONST=0.0245;        // PhysicsEngine.G = 9.8/400
const TPS=20;                // Tick/秒
const KT_PER_KMH=1/72;       // km/h -> 格/Tick
const toKMH=v=>v*72;
const toMach=v=>v*20/343;
const EPS=1e-8;

/* ---------- 默认大气阻力表（与当前仓库 RVP_ProjectileData 一致） ---------- */
const DEFAULT_ALT={h:[-64,64,320,550,1000],f:[2.0,1.5,0.5,0.25,0.014]};
function defaultAltFactor(y){
  const H=DEFAULT_ALT.h,F=DEFAULT_ALT.f;
  if(y<=H[0]) return F[0];
  for(let i=1;i<H.length;i++){
    if(y<=H[i]){ const t=(y-H[i-1])/(H[i]-H[i-1]); return F[i-1]+(F[i]-F[i-1])*t; }
  }
  return F[F.length-1];
}
/** "[[a,b]]": v 区间表解析（RVP_Range：闭区间；inf / null = 无界）。 */
function parseRangeMap(obj){
  if(obj==null||typeof obj!=="object") return null;
  const out=[];
  for(const k of Object.keys(obj)){
    const m=/^\[\[([^,\]]+),([^,\]]+)\]\]$/.exec(k.trim());
    if(!m) continue;
    function bound(s,lower){
      s=s.trim().toLowerCase();
      if(s===""||s==="null") return lower?-Infinity:Infinity;
      if(s.indexOf("inf")>=0) return s[0]==="-"?-Infinity:Infinity;
      const n=parseFloat(s);
      return isNaN(n)?(lower?-Infinity:Infinity):n;
    }
    const v=parseFloat(obj[k]);
    if(!isFinite(v)||v<=0) continue;
    out.push({lo:bound(m[1],true),hi:bound(m[2],false),v});
  }
  out.sort((a,b)=>a.lo-b.lo);
  return out.length?out:null;
}
function sampleRangeMap(map,y){
  if(!map) return null;
  for(const r of map){ if(y>=r.lo&&y<=r.hi) return r.v; }
  return null;
}
/** 移植 resolveAltitudeDragFactor：显式表优先，缺省默认表；空表/未命中/非法=1.0。 */
function altFactor(y,explicitMap){
  if(explicitMap==null) return defaultAltFactor(y);
  if(explicitMap.length===0) return 1.0;
  const v=sampleRangeMap(explicitMap,y);
  return (v!=null&&isFinite(v)&&v>0)?v:1.0;
}

/* ---------- 武器 JSON 解析 ---------- */
function num(v,def){ return (typeof v==="number"&&isFinite(v))?v:def; }
/** guidance_tick_range 之类区间串的起始 Tick。 */
function rangeStart(v){
  if(typeof v==="string"){
    const m=/\[\[\s*(-?(?:\d+\.?\d*|\.\+)|inf|-inf|null)/i.exec(v);
    if(!m) return 0;
    const s=m[1].toLowerCase();
    if(s==="inf"||s==="null") return 0;
    if(s==="-inf") return 0;
    const n=parseFloat(s);
    return isNaN(n)?0:Math.max(0,n);
  }
  if(v&&typeof v==="object"){ const m=parseRangeMap(v); return m&&m.length?Math.max(0,m[0].lo):0; }
  return 0;
}
function parseMissile(text,filename){
  const w=JSON.parse(text);
  if(w.type!=="rvp:missile") return null;
  const p=w.projectile_data||{};
  const gd=w.guidance_data||{};
  const tfRaw=p.turning_factor;
  const fuse=w.fuse_data||{};
  const altRaw=p.altitude_drag_factor;
  const altMap=(altRaw==null)?null:(parseRangeMap(altRaw)||[]);
  const msfRaw=p.altitude_max_speed_factor;
  const msfMap=(msfRaw==null)?null:(parseRangeMap(msfRaw)||[]);
  return {
    file:filename,
    name:w.name_CN||w.name||filename,
    enName:(w.name&&w.name!==w.name_CN)?w.name:"",
    gtype:gd.guidance_type||"—",
    preset:(gd.preset_cruise_altitude!=null)?{
      cruiseAltitude:num(gd.preset_cruise_altitude,0),
      maxAscentLead:num(gd.preset_max_ascent_lead,60),
      diveRadius:num(gd.preset_dive_radius,0),
      diveAltitudeFactor:num(gd.preset_dive_altitude_factor,0.3),
      diveLeadFactor:num(gd.preset_dive_lead_factor,1.5),
      maneuver:num(gd.preset_tactical_maneuver_amplitude,0),
    }:null,
    loft:(gd.loft_height_above_target!=null)?{
      height:num(gd.loft_height_above_target,0),
      end:num(gd.loft_end_distance,0),
      blend:num(gd.loft_blend_distance,0),
    }:null,
    activeRadarRange:num(gd.active_radar_activation_range,0),
    predict:gd.predict_target_pos===true,
    guideStart:rangeStart(gd.guidance_tick_range),
    v0:num(p.velocity,num(w.velocity,10)),
    gravity:num(p.gravity,0),
    cd:num(p.drag_coefficient,0),
    mass:num(p.mass,0),
    fuel:num(p.fuel_mass,0),
    thrust:num(p.thrust,0),
    burn:num(p.motor_burn_time,0),
    ign:num(p.ignition_delay_tick,0),
    minSpeed:num(p.min_speed,0),
    maxSpeed:num(p.max_speed,0),
    engine:(p.has_rocket_engine!==false)&&(num(p.thrust,0)>0||p.has_rocket_engine===true),
    constantSpeed:p.constant_speed===true,
    aero:p.rvp_aero_steering===true,
    aaLimit:num(p.rvp_attack_angle_limit_deg,0),
    rvpMaxG:(p.rvp_maxg!=null)?num(p.rvp_maxg,null):null,
    tfConst:(typeof tfRaw==="number")?tfRaw:null,
    tfMap:(tfRaw&&typeof tfRaw==="object")?parseRangeMap(tfRaw):null,
    refSpeedExplicit:(p.rvp_ref_speed!=null)?num(p.rvp_ref_speed,null):null,
    turnRateLimit:num(p.rvp_turn_rate_limit,0),
    inducedDragExplicit:(p.rvp_induced_drag!=null)?num(p.rvp_induced_drag,null):null,
    altMap,
    msfMap,
    sp:{on:p.second_pulse===true, thrust:num(p.second_pulse_thrust,0), burn:num(p.second_pulse_burn_time,0),
        speed:num(p.second_pulse_trigger_speed,0), dist:num(p.second_pulse_trigger_distance,0)},
    ivv:p.inherit_vehicle_velocity===true,
    cbs:num(p.collision_box_size,0.0625),
    pfh:num(fuse.proximity_fuse_height,0),
  };
}

        +(prof.maxSpeed>0?"  最大 "+prof.maxSpeed.toFixed(1):"  无最大钳制"));

  if(prof.thrust>0)

  if(prof.sp.on)

  if(prof.preset)

  if(prof.loft)

          +(prof.activeRadarRange>0?"，导引头 "+prof.activeRadarRange+"m 开机后转直追":"")
          +"，引导自 Tick "+prof.guideStart);

/* ---------- 气动预算（移植 RVP_AeroSteeringModel） ---------- */
function equivGsFromTF(tf,ref){
  if(!isFinite(tf)||!isFinite(ref)||ref<=EPS) return 0;
  tf=clamp(tf,0,1);
  if(tf>=1) return Infinity;
  if(tf<=0) return 0;
  const designTurnAngle=Math.atan2(tf,1-tf);
  return 2*ref*Math.sin(designTurnAngle/2)/G_CONST;
}
function availableGs(speed,designGs,ref,density){
  if(!isFinite(designGs)) return Infinity;
  const q=(ref<=EPS)?1:clamp(density*Math.pow(speed/ref,2),0.05,1.0);
  return designGs*q;
}
/** 移植 RVP_AttackAngleModel.solve：机头/速度分离、攻角锥、λ、法向转角。 */
function solveAttackAngle(vel,body,desired,lim){
  const speed=vel.len();
  if(speed<=EPS||!lim.enabled) return {vel,body,bodyNorm:body.norm(),load:0,alpha:0};
  const axis=vel.norm();
  const des=(desired&&desired.len()>EPS)?desired.norm():axis;
  const response=(lim.rvpMaxG!=null)?0.5:clamp(lim.tf,0,1);
  let nb=slerpDir(body,des,response);
  const cap=rad(lim.aaLimit);
  let ang=angleBetween(axis,nb);
  if(ang>cap){ nb=slerpDir(axis,nb,cap/ang); ang=cap; }
  const load=Math.sin(ang)/Math.sin(cap);
  const nG=availableGs(speed,lim.designGs,lim.ref,lim.density)*load;
  let turn=2*Math.asin(clamp(nG*G_CONST/(2*speed),0,1));
  if(isFinite(lim.turnRateLimit)&&lim.turnRateLimit>0) turn=Math.min(turn,rad(lim.turnRateLimit));
  turn=isFinite(turn)?Math.min(turn,ang):0;
  const next=(ang>EPS&&turn>0)?slerpDir(axis,nb,turn/ang).scale(speed):vel;
  return {vel:next,body:nb,bodyNorm:nb,load:clamp(load,0,1),alpha:ang};
}

/* ---------- PRESET 弹道（移植 RVP_GuidanceRuntimeMath.shouldBeginPresetDive /
 * steerPresetTerminal / steerPresetBallisticArc + RVP_BallisticTrajectoryMath 弧线采样） ---------- */
function resolveTurnRadiusRVP(speed,prof,tf,ref,density){
  if(prof.aero){
    const designGs=(prof.rvpMaxG!=null)?((isFinite(prof.rvpMaxG)&&prof.rvpMaxG>0)?prof.rvpMaxG:0)
                                       :equivGsFromTF(tf,ref);
    const gs=availableGs(speed,designGs,ref,density);
    if(!isFinite(gs)) return 8.0;
    if(!isFinite(gs)||gs<=0) return Infinity;
    const mdv=gs*G_CONST;
    if(mdv>=2*speed) return 8.0;
    return clamp(speed*speed/mdv,8,80);
  }
  if(prof.rvpMaxG!=null){
    const gs=(isFinite(prof.rvpMaxG)&&prof.rvpMaxG>0)?prof.rvpMaxG:0;
    if(gs<=0) return 8.0;
    const mdv=gs*G_CONST;
    if(mdv>=2*speed) return 8.0;
    return clamp(speed*speed/mdv,8,80);
  }
  const f=clamp(tf,0,1);
  if(f<=0) return Infinity;
  return clamp(speed/f,8,80);
}
/** 返回期望方向（未限幅），攻角/旧转向分支按各自裁决消费。 */
function presetDesired(pos,vel,aim,launch,preset,prof,tf,ref,y){
  const speed=vel.len();
  const tr=resolveTurnRadiusRVP(speed,prof,tf,ref,altFactor(y,prof.altMap));
  const dx=pos.x-aim.x,dz=pos.z-aim.z;
  const vertDist=Math.max(0,pos.y-aim.y);
  const diveDistance=Math.max(preset.diveRadius,Math.max(
    vertDist*preset.diveAltitudeFactor,tr*preset.diveLeadFactor));
  const hSqr=dx*dx+dz*dz;
  let diving=hSqr<=diveDistance*diveDistance;
  if(!diving){
    const rx=aim.x-launch.x,rz=aim.z-launch.z;
    const mx=aim.x-pos.x,mz=aim.z-pos.z;
    diving=(mx*rx+mz*rz)<=0.0;
  }
  if(diving){
    // 终端俯冲：未过顶指目标；过顶/极近则锁定水平方向全力下压
    const toT=aim.sub(pos);
    const hs=toT.x*toT.x+toT.z*toT.z;
    const vh=new V3(vel.x,0,vel.z),vhs=vh.x*vh.x+vh.z*vh.z;
    const overshoot=hs>1e-8&&vhs>1e-8&&(vh.x*toT.x+vh.z*toT.z)<0;
    const veryClose=hs<=Math.max(1.0,speed*speed*0.25);
    if(overshoot||veryClose){
      return vhs>1e-8?vh.scale(0.25/Math.sqrt(vhs)).add(new V3(0,-1,0)):new V3(0,-1,0);
    }
    return toT;
  }
  // 抛物线中段：追 前视点 + 4p(1-p) 抛物线高度，顶点 = min(巡航高, 0.5×射程)
  const toHx=aim.x-pos.x,toHz=aim.z-pos.z;
  const hDist=Math.sqrt(toHx*toHx+toHz*toHz);
  if(hDist<=1e-8) return aim.sub(pos);
  const fHx=toHx/hDist,fHz=toHz/hDist;
  let totalH=hDist;
  { const ax=aim.x-launch.x,az=aim.z-launch.z; const ts=ax*ax+az*az; if(ts>1e-8) totalH=Math.sqrt(ts); }
  const p=clamp(1.0-hDist/totalH,0,1);
  const apogee=Math.min(preset.cruiseAltitude,totalH*0.50);
  const base=Math.min(40.0,apogee*0.3);
  const lookAhead=Math.min(preset.maxAscentLead,hDist*0.3);
  const ahead=Math.max(hDist-lookAhead,0.0);
  const laP=clamp(1.0-ahead/totalH,0,1);
  const targetY=launch.y+base+(apogee-base)*4.0*laP*(1.0-laP);
  let tp=new V3(pos.x+fHx*lookAhead,targetY,pos.z+fHz*lookAhead);
  if(preset.maneuver>0){
    const w=clamp((p-0.15)/0.05,0,1)*clamp((0.85-p)/0.05,0,1);
    if(w>1e-4){
      const phase=Math.PI*2.0*p*5.0;
      tp=tp.add(new V3(-fHz,0,fHx).scale(preset.maneuver*Math.sin(phase)*w));
    }
  }
  return tp.sub(pos);
}

/* ---------- 模拟器（实体链同序：制导 -> 推力 -> 阻力 -> 重力 -> 钳制 -> 诱导阻力） ---------- */
function simulate(prof,prm){
  const carrier=prm.carrierKmh*KT_PER_KMH;
  let v0=prof.v0+(prof.ivv?Math.max(carrier,0):0);
  const yawR=rad(prm.launchYaw);
  const launchDir=dirFromPitchYaw(prm.launchAngle,yawR);
  const fwd=new V3(Math.cos(yawR),0,Math.sin(yawR));
  const right=new V3(-fwd.z,0,fwd.x);
  let vel=launchDir.scale(v0);
  let body=launchDir;
  let pos=new V3(0,prm.launchAlt,0);
  // 目标：方位角相对发射航向；航向 0 = 迎头直奔发射点；垂直航向正=爬升；恒定G转弯正=左转
  const bear=rad(prm.tgtBearing);
  const tSpd=prm.tgtSpeedKmh*KT_PER_KMH;
  let tgt=null;
  if(prm.target){
    const tpos=new V3(
      fwd.x*Math.cos(bear)+right.x*Math.sin(bear),
      0,
      fwd.z*Math.cos(bear)+right.z*Math.sin(bear)
    ).scale(prm.tgtDist).add(new V3(0,prm.tgtAlt,0));
    const tvel=dirFromPitchYaw(prm.tgtClimb||0,yawR+Math.PI+rad(prm.tgtHeading)).scale(tSpd);
    tgt={pos:tpos,vel:tvel};
  }
  // GPS 固定点语义：PRESET 瞄准目标初始位置（tgt.pos 每 Tick 重建新对象，此处引用即初始点）
  const aimPoint=(tgt&&prof.preset)?tgt.pos:null;
  const launchPos=new V3(0,prm.launchAlt,0);
  // rvp_ref_speed 回退链：显式(0=关) -> max_speed -> 武器初速 -> 3.0
  let ref;
  if(prof.refSpeedExplicit!=null) ref=Math.max(prof.refSpeedExplicit,0);
  else if(prof.maxSpeed>0) ref=prof.maxSpeed;
  else if(isFinite(prof.v0)&&prof.v0>0) ref=prof.v0;
  else ref=3.0;
  function tfAt(tick){
    if(prof.tfConst!=null) return prof.tfConst;
    if(prof.tfMap){ const v=sampleRangeMap(prof.tfMap,Math.max(tick,0)); if(v!=null) return clamp(v,0,1); }
    return 0.5;
  }
  function aaEnabled(tick){
    if(!prof.aero) return false;
    if(!(prof.aaLimit>0&&prof.aaLimit<90)) return false;
    return (prof.rvpMaxG!=null)||(isFinite(tfAt(tick))&&tfAt(tick)<1);
  }
  const dry=Math.max(prof.mass-prof.fuel,0);
  const burnWin=Math.max(prof.burn,1);
  function massAt(motorTick){
    if(!prof.engine||prof.fuel<=0||prof.mass<=0) return prof.mass;
    const prog=clamp(motorTick/burnWin,0,1);
    return dry+prof.fuel*(1-prog);
  }
  const dryEnd=massAt(Math.round(prof.burn));
  const induced=prof.aero?(prof.inducedDragExplicit!=null?Math.max(prof.inducedDragExplicit,0)
                                          :(prof.engine?Math.max(prof.cd,0):0)):0;
  const hitR=Math.max(prof.cbs,prof.pfh>0?prof.pfh:0)+Math.max(prm.tgtRadius||0,0);
  const maxTicks=Math.max(1,Math.round(prm.maxSeconds*TPS));
  const frames=[];
  let spStarted=-1,minMiss=Infinity,hitTick=-1,impactTick=-1,traveled=0,seekerCatch=false;
  let prevSpeed=vel.len();
  for(let tick=0;tick<=maxTicks;tick++){
    /* --- 制导（攻角求解/旧转向） --- */
    let nG=0,alpha=0,load=0;
    const speed0=vel.len();
    let desired;
    if(aimPoint) desired=presetDesired(pos,vel,aimPoint,launchPos,prof.preset,prof,tfAt(tick),ref,pos.y);
    else if(tgt&&tick>=prof.guideStart){
      // ARH 主动导引头开机截获（距离闩锁近似；不含 ECM/诱饵/FOV）
      if(!seekerCatch&&prof.activeRadarRange>0&&pos.sub(tgt.pos).len()<=prof.activeRadarRange) seekerCatch=true;
      let aim=tgt.pos;
      if(prof.loft&&!seekerCatch){
        // loft 高抛：瞄准点 = 目标实时位置 + (0, 高度×smoothstep, 0)，近距退坡归零
        const dxh=tgt.pos.x-pos.x,dzh=tgt.pos.z-pos.z;
        const hDist=Math.sqrt(dxh*dxh+dzh*dzh);
        let b=prof.loft.blend>0?clamp((hDist-prof.loft.end)/prof.loft.blend,0,1)
                               :(hDist>prof.loft.end?1:0);
        b=b*b*(3-2*b);
        aim=new V3(tgt.pos.x,tgt.pos.y+prof.loft.height*b,tgt.pos.z);
      }
      desired=(prof.predict&&speed0>1e-8)
        ?pipDesired(pos,vel,aim,tgt.vel)||aim.sub(pos)
        :aim.sub(pos);
    }
    else desired=vel;
    const designGs=(prof.rvpMaxG!=null)?((isFinite(prof.rvpMaxG)&&prof.rvpMaxG>0)?prof.rvpMaxG:0)
                                 :equivGsFromTF(tfAt(tick),ref);
    const availGr=(prof.aero&&speed0>EPS)?availableGs(speed0,designGs,ref,altFactor(pos.y,prof.altMap)):null;
    if(aaEnabled(tick)&&speed0>EPS){
      const tf=tfAt(tick);
      const lim={
        enabled:true,aaLimit:prof.aaLimit,rvpMaxG:prof.rvpMaxG,tf,ref,
        density:altFactor(pos.y,prof.altMap),turnRateLimit:prof.turnRateLimit,
        designGs
      };
      const sol=solveAttackAngle(vel,body,desired,lim);
      vel=sol.vel; body=sol.body; alpha=sol.alpha; load=sol.load;
      nG=availableGs(vel.len(),lim.designGs,lim.ref,lim.density)*load;
    } else if(speed0>EPS){
      const tf=tfAt(tick);
      if(tgt&&tf>0){
        const nd=(tf>=1)?desired.norm():slerpDir(vel.norm(),desired.norm(),tf);
        vel=nd.scale(speed0);
      }
      body=vel.norm();
    }
    /* --- 运动（tickMissileMove 同序） --- */
    const ign=Math.max(prof.ign,0);
    let curMass=prof.mass,curThrust=0,curDrag=0;
    if(tick>=ign){
      const motorTick=tick-ign;
      let mass=dryEnd,thrust=0,burning=false;
      if(prof.engine&&motorTick<=prof.burn&&prof.thrust>0){
        burning=true; thrust=prof.thrust; mass=massAt(Math.max(motorTick,0));
      } else if(prof.engine&&prof.sp.on&&prof.sp.thrust>0&&prof.sp.burn>0&&(prof.sp.speed>0||prof.sp.dist>0)){
        if(spStarted<0&&motorTick>prof.burn){
          const speedOk=prof.sp.speed>0&&vel.len()<=prof.sp.speed;
          const distOk=prof.sp.dist>0&&tgt!=null&&pos.sub(tgt.pos).len()<=prof.sp.dist;
          if(speedOk||distOk) spStarted=tick;
        }
        if(spStarted>=0){
          const t2=tick-spStarted;
          if(t2>=0&&t2<=prof.sp.burn){ burning=true; thrust=prof.sp.thrust; mass=dryEnd; }
        }
      }
      curMass=mass; curThrust=burning?thrust:0;
      if(burning&&thrust>0&&mass>0){
        vel=vel.add(body.scale(thrust/Math.max(mass,1e-6)));
      }
      // 速度平方阻力（阻力质量 <1 按吨×1000）；推力/阻力单位 = kg·格/Tick²（与 JSON 推力同量纲）
      const dragMass=mass<1?mass*1000:mass;
      const spd=vel.len();
      if(prof.cd>0&&spd>1e-12&&dragMass>0){
        const aF=altFactor(pos.y,prof.altMap);
        const loss=prof.cd*spd*spd/dragMass*aF;
        curDrag=prof.cd*spd*spd*aF;
        vel=vel.scale(Math.max(0,1-loss/spd));
      }
      // 配置重力（84 弹多为 0）
      if(prof.gravity!==0) vel=new V3(vel.x,vel.y+prof.gravity,vel.z);
    }
    // 速度钳制（先上限后下限；0=不限）
    {
      const spd=vel.len();
      if(spd>1e-6){
        let s=spd;
        let effMax=prof.maxSpeed>0?prof.maxSpeed*maxSpeedFactorAt(pos.y,prof.msfMap):0;
        if(effMax>0&&s>effMax) s=effMax;
        if(prof.minSpeed>0&&s<prof.minSpeed) s=prof.minSpeed;
        if(s!==spd) vel=vel.norm().scale(s);
      }
    }
    // 诱导阻力（速度钳制后一次；constant_speed 豁免）
    if(prof.aero&&!prof.constantSpeed&&induced>0&&load>0){
      const spd=vel.len();
      if(spd>1e-8){
        const loss=induced*load*load*spd;
        const floor=Math.min(spd,Math.max(prof.minSpeed,0.01));
        vel=vel.norm().scale(Math.max(spd-loss,floor));
      }
    }
    // 平移（扫掠命中：判定目标点到本 Tick 位移线段的最短距离，对应游戏射线扫掠）
    const prevPos=pos;
    pos=pos.add(vel);
    traveled+=vel.len();
    let tFwd=Infinity,tLat=Infinity,tY=Infinity,tD=Infinity,sweptD=Infinity;
    if(tgt){
      // 恒定G协调转弯：仅旋转水平分量（保持爬升率），ω=G·g/v（rad/Tick），正=左转
      if(prm.tgtTurnG>0&&tSpd>1e-6){
        const w=prm.tgtTurnG*G_CONST/tSpd,c=Math.cos(w),s=Math.sin(w);
        tgt.vel=new V3(tgt.vel.x*c+tgt.vel.z*s,tgt.vel.y,-tgt.vel.x*s+tgt.vel.z*c);
      }
      tgt.pos=tgt.pos.add(tgt.vel);
      tFwd=tgt.pos.x*fwd.x+tgt.pos.z*fwd.z;
      tLat=tgt.pos.x*right.x+tgt.pos.z*right.z;
      tY=tgt.pos.y;
      tD=pos.sub(tgt.pos).len();
      sweptD=segPointDist(prevPos,pos,tgt.pos);
      if(sweptD<minMiss) minMiss=sweptD;
    }
    const spdEnd=vel.len();
    const fpa=spdEnd>1e-6?Math.asin(clamp(vel.y/spdEnd,-1,1))*180/Math.PI:0;
    frames.push({t:tick,
      fwd:pos.x*fwd.x+pos.z*fwd.z, lat:pos.x*right.x+pos.z*right.z,
      y:pos.y, speed:vel.len(), accel:(vel.len()-prevSpeed)*400,
      nG, alphaDeg:alpha*180/Math.PI, load, distT:tD, traveled,
      thrust:curThrust, drag:curDrag, mass:curMass,
      availG:(availGr!=null&&isFinite(availGr))?availGr:null, fpa,
      sp:(spStarted<0?0:((tick-spStarted)<=prof.sp.burn?1:2)),
      tFwd,tLat,tY});
    prevSpeed=vel.len();
    if(tgt&&sweptD<=hitR){ hitTick=tick; break; }
    if(pos.y<=prm.groundY&&tick>0){ impactTick=tick; break; }
  }
  return {frames,hitTick,impactTick,minMiss,hitR,groundY:prm.groundY,
    end:frames.length?frames[frames.length-1]:null,fwd,right};
}

/* ---------- 内置示例弹（自检/演示用，AIM-120D 级参数 + 分层极速示例） ---------- */

function countPixels(){
  const img=ctx.getImageData(0,0,cv.width,cv.height).data;
  let red=0,blue=0,black=0;
  for(let i=0;i<img.length;i+=16){
    const R=img[i],G=img[i+1],Bl=img[i+2];
    if(R>170&&G<90&&Bl<80) red++;
    else if(Bl>170&&R<90&&G<140) blue++;
    else if(R<45&&G<45&&Bl<45) black++;
  }
  return {red,blue,black};
}
function runSelftest(){

async function pickDirectory(){
  if(window.showDirectoryPicker){
    try{
      const dir=await window.showDirectoryPicker();
      S.profiles=[]; S.errors=[];
      await walkHandle(dir,0);
      afterLoad("（"+dir.name+"）");
      return;
    }catch(e){ if(e&&e.name==="AbortError") return; }
  }
  document.getElementById("dirFallback").click();
}
async function walkHandle(dir,depth){
  for await(const entry of dir.values()){
    if(entry.kind==="directory"){
      if(entry.name==="_backup") continue;
      if(depth<6) await walkHandle(entry,depth+1);
      continue;
    }
    if(!entry.name.toLowerCase().endsWith(".json")) continue;
    try{
      const fh=await entry.getFile();
      const prof=parseMissile(await fh.text(),entry.name);
      if(prof) S.profiles.push(prof);
    }catch(e){ S.errors.push(entry.name+": "+e.message); }
  }
}
function onFallbackFiles(ev){
  const files=[...ev.target.files].filter(f=>{
    const rp=f.webkitRelativePath||"";
    return /\.json$/i.test(f.name)&&rp.indexOf("_backup")<0;
  });
  S.profiles=[]; S.errors=[];
  if(!files.length){ afterLoad("（浏览器回退模式）"); return; }
  let pending=files.length;
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{
      try{ const prof=parseMissile(r.result,f.name); if(prof) S.profiles.push(prof); }
      catch(e){ S.errors.push(f.name+": "+e.message); }
      if(--pending===0) afterLoad("（浏览器回退模式）");
    };
    r.readAsText(f);
  });
}

  fillMissileOptions(document.getElementById("search").value);
  document.getElementById("dirLabel").textContent="已加载 "+S.profiles.length+" 枚导弹 "+label

function recompute(){
  document.getElementById("carrierSpeed").disabled=!(S.current&&S.current.ivv);
  updateCmpBtn();
  if(!S.current){ S.result=null; draw(); return; }
  document.getElementById("missileInfo").textContent=summary(S.current);
  try{ S.result=simulate(S.current,currentParams()); }
  catch(e){
    document.getElementById("statusBar").textContent="模拟出错: "+e.message;
    S.result=null; draw(); return;
  }
  // 对比组共享当前场景参数整体重算
  S.compare.forEach(c=>{
    if(c.prof===S.current){ c.result=S.result; return; }
    try{ c.result=simulate(c.prof,currentParams()); }catch(e){ c.result=null; }
  });
  updateLegend();
  S.cursor=0;
  const r=S.result;
  document.getElementById("scrub").max=Math.max(0,r.frames.length-1);
  document.getElementById("scrub").value=0;
  document.getElementById("hitLabel").textContent=
    r.hitTick>=0?("命中: "+(r.hitTick/TPS).toFixed(1)+" 秒"):
    (r.impactTick>=0?("坠地: "+(r.impactTick/TPS).toFixed(1)+" 秒"):
    (isFinite(r.minMiss)?"最小脱靶 "+r.minMiss.toFixed(0)+" m":""));
  const last=r.end;
  let peak=0; r.frames.forEach(f=>{ if(f.speed>peak) peak=f.speed; });
  document.getElementById("statusBar").textContent=
    S.current.name+" ｜ 弹道 "+(r.frames.length-1)+" Tick（"+((r.frames.length-1)/TPS).toFixed(1)+" 秒）"
    +" ｜ 峰速 "+toKMH(peak).toFixed(0)+" km/h（M"+toMach(peak).toFixed(2)+"）"
    +" ｜ 前向距离 "+Math.round(last?last.fwd:0)+" m"
    +(r.hitTick>=0?" ｜ 命中":(r.impactTick>=0?" ｜ 坠地":" ｜ 达到模拟上限"));
  updateCursor();
}

function verdictTxt(r){

  if(r.impactTick>=0) return "坠地 "+(r.impactTick/TPS).toFixed(1)+" 秒";

/* ---------- 图表 ---------- */
const cv=document.getElementById("chart"),ctx=cv.getContext("2d");
function fmtDist(v){ return Math.abs(v)>=10000?(v/1000).toFixed(1)+"k":String(Math.round(v)); }
function niceStep(span,px){
  const raw=span/Math.max(2,px/90);
  const p=Math.pow(10,Math.floor(Math.log10(raw||1)));
  const c=[1,2,5,10].map(k=>k*p).find(s=>s>=raw);
  return c||raw||1;
}
function draw(){
  const box=cv.parentElement.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  const w=Math.max(50,Math.round(box.width)),h=Math.max(50,Math.round(box.height));
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  if(!S.result||S.result.frames.length<2){
    ctx.fillStyle="#8a97a5";ctx.font="14px sans-serif";ctx.textAlign="center";
    ctx.fillText("加载导弹后此处绘制弹道",w/2,h/2);
    S.chartMap=null;return;
  }
  const r=S.result,fr=r.frames;
  const mode=document.getElementById("viewMode").value;
  const side=mode==="side",speedView=mode==="speed",view3d=mode==="3d";
  if(mode==="curves"){ drawCurves(w,h); return; }
  const yaw=rad(parseFloat(document.getElementById("viewYaw").value)||35); // 0~360 全向
  const zoom=clamp(parseFloat(document.getElementById("viewZoom").value)||1,0.2,5);
  const cs3=Math.cos(yaw),sn3=Math.sin(yaw);
  // 相机：高度严格向上；地面绕垂直轴旋转 yaw，深度轴以 0.42 压扁
  const cam=(fx,ly,ys)=>({x:fx*cs3-ly*sn3, z:(fx*sn3+ly*cs3)*0.42, a:ys});
  const p3=(fx,ly,ys)=>{const c=cam(fx,ly,ys);return {sx:c.x,sy:c.z-c.a};};
  const proj=f=>p3(f.fwd,f.lat,f.y);
  // 速度剖面视图 Y=速度(km/h)；其余视图 Y=世界坐标
  const framePoint=speedView?(f=>({sx:f.fwd,sy:f.speed*72})):proj;
  const pts=fr.map(framePoint);
  let tMarkSX=null,tMarkSY=null;
  let mnx=Infinity,mxx=-Infinity,mny=Infinity,mxy=-Infinity;
  pts.forEach(q=>{if(q.sx<mnx)mnx=q.sx;if(q.sx>mxx)mxx=q.sx;if(q.sy<mny)mny=q.sy;if(q.sy>mxy)mxy=q.sy;});
  if(!speedView){
    fr.forEach(f=>{
      if(f.tFwd===Infinity) return;
      if(f.tFwd<mnx)mnx=f.tFwd; if(f.tFwd>mxx)mxx=f.tFwd;
      if(view3d){ if(f.tLat<mny)mny=f.tLat; if(f.tLat>mxy)mxy=f.tLat; }
      if(f.tY<mny)mny=f.tY; if(f.tY>mxy)mxy=f.tY;
    });
  }
  // 速度剖面：把分层极速包络纳入量纲（与轨迹同为 km/h 轴）
  if(speedView&&S.current&&S.current.maxSpeed>0){
    fr.forEach(f=>{
      const cap=S.current.maxSpeed*(S.current.msfMap?maxSpeedFactorAt(f.y,S.current.msfMap):1)*72;
      if(cap<mny)mny=cap; if(cap>mxy)mxy=cap;
    });
  }
  // 对比弹轨迹纳入视野
  (S.compare||[]).forEach(cp=>{
    if(!cp.result||cp.prof===S.current) return;
    cp.result.frames.forEach(f=>{
      const q=framePoint(f);
      if(q.sx<mnx)mnx=q.sx; if(q.sx>mxx)mxx=q.sx;
      if(q.sy<mny)mny=q.sy; if(q.sy>mxy)mxy=q.sy;
    });
  });
  let B=null;
  if(view3d){
    const f1=Math.max(...fr.map(f=>f.fwd),100)*1.05;
    let l0=0,l1=0; fr.forEach(f=>{l0=Math.min(l0,f.lat*1.3-40);l1=Math.max(l1,f.lat*1.3+40);});
    const y0=r.groundY;
    const y1=Math.max(...fr.map(f=>f.y),y0+100)*1.12;
    B={f0:0,f1,l0,l1,y0,y1,c:[
      p3(0,l0,y0),p3(f1,l0,y0),p3(f1,l1,y0),p3(0,l1,y0),
      p3(0,l0,y1),p3(f1,l0,y1),p3(f1,l1,y1),p3(0,l1,y1)]};
    B.c.forEach(c=>{if(c.sx<mnx)mnx=c.sx;if(c.sx>mxx)mxx=c.sx;if(c.sy<mny)mny=c.sy;if(c.sy>mxy)mxy=c.sy;});
  }
  const padL=70,padR=24,padT=18,padB=44;
  let toS;
  if(view3d){
    const spanX=Math.max(mxx-mnx,10),spanY=Math.max(mxy-mny,10);
    const sc=Math.min((w-padL-padR)/spanX,(h-padT-padB)/spanY)*zoom;
    const cX=(mnx+mxx)/2,cY=(mny+mxy)/2;
    toS=q=>({sx:w/2+(q.sx-cX)*sc, sy:h/2+(q.sy-cY)*sc});
  } else {
    const eq=document.getElementById("equalAspect").checked;
    let scX=(w-padL-padR)/Math.max(mxx-mnx,10);
    let scY=(h-padT-padB)/Math.max(mxy-mny,10);
    if(eq) scX=scY=Math.min(scX,scY); // 等比例：统一取小；不勾则 X/Y 独立拉伸填满
    toS=q=>({sx:padL+(q.sx-mnx)*scX, sy:h-padB-(q.sy-mny)*scY});
  }
  ctx.lineWidth=1;
  if(!view3d){
    ctx.strokeStyle="#e3e8ee";ctx.fillStyle="#66788c";ctx.font="11px sans-serif";
    const stepY=niceStep(mxy-mny,h-padT-padB);
    for(let v=Math.ceil(mny/stepY)*stepY;v<=mxy;v+=stepY){
      const s=toS({sx:v,sy:v});
      ctx.beginPath();ctx.moveTo(padL,s.sy);ctx.lineTo(w-padR,s.sy);ctx.stroke();
      ctx.textAlign="right";ctx.fillText(fmtDist(v),padL-6,s.sy+4);
    }
    const stepX=niceStep(mxx-mnx,w-padL-padR);
    for(let v=Math.ceil(mnx/stepX)*stepX;v<=mxx;v+=stepX){
      const s=toS({sx:v,sy:0});
      ctx.beginPath();ctx.moveTo(s.sx,padT);ctx.lineTo(s.sx,h-padB);ctx.stroke();
      ctx.textAlign="center";ctx.fillText(fmtDist(v),s.sx,h-padB+16);
    }
    ctx.strokeStyle="#c7d0da";ctx.strokeRect(padL,padT,w-padL-padR,h-padT-padB);
    ctx.textAlign="center";
    ctx.fillText("前向距离 - X（米）",(padL+w-padR)/2,h-8);
    ctx.save();ctx.translate(14,(padT+h-padB)/2);ctx.rotate(-Math.PI/2);
    ctx.fillText(side?"高度（米）":(speedView?"速度（公里/小时）":"横向距离 - Z（米）"),0,0);ctx.restore();
  } else {
    ctx.fillStyle="#66788c";ctx.font="11px sans-serif";ctx.textAlign="left";
    ctx.fillText("三维视图：拖动“视角旋转”变方位、“缩放”调远近（单位：米）",padL+8,padT+2);
  }
  if(!view3d&&!speedView){
    const gy=r.groundY;
    if(gy>=mny&&gy<=mxy){
      const s=toS({sx:0,sy:gy});
      ctx.strokeStyle="#8d6e63";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(padL,s.sy);ctx.lineTo(w-padR,s.sy);ctx.stroke();
      ctx.fillStyle="#8d6e63";ctx.font="11px sans-serif";ctx.textAlign="left";
      ctx.fillText("地面 Y="+Math.round(gy),padL+6,s.sy-4);
    }
  }
  if(view3d&&B){
    const q=B.c.map(c=>toS({sx:c.sx,sy:c.sy}));
    const seg2=(a,b)=>{ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);ctx.stroke();};
    const quad=(i0,i1,i2,i3,fill)=>{
      ctx.fillStyle=fill;ctx.beginPath();
      ctx.moveTo(q[i0].sx,q[i0].sy);ctx.lineTo(q[i1].sx,q[i1].sy);
      ctx.lineTo(q[i2].sx,q[i2].sy);ctx.lineTo(q[i3].sx,q[i3].sy);ctx.closePath();ctx.fill();
    };
    quad(3,2,6,7,"rgba(241,245,249,.75)");
    quad(1,2,6,5,"rgba(246,249,252,.75)");
    quad(0,1,2,3,"rgba(250,251,253,.9)");
    ctx.strokeStyle="#dfe6ee";ctx.lineWidth=1;
    const stepF=niceStep(B.f1-B.f0,6), stepL=niceStep(B.l1-B.l0,6), stepY3=niceStep(B.y1-B.y0,6);
    for(let v=Math.ceil(B.f0/stepF)*stepF;v<=B.f1;v+=stepF){
      seg2(toS(p3(v,B.l0,B.y0)),toS(p3(v,B.l1,B.y0)));
      seg2(toS(p3(v,B.l1,B.y0)),toS(p3(v,B.l1,B.y1)));
    }
    for(let v=Math.ceil(B.l0/stepL)*stepL;v<=B.l1;v+=stepL){
      seg2(toS(p3(B.f0,v,B.y0)),toS(p3(B.f1,v,B.y0)));
      seg2(toS(p3(B.f1,v,B.y0)),toS(p3(B.f1,v,B.y1)));
    }
    for(let v=Math.ceil(B.y0/stepY3)*stepY3;v<=B.y1;v+=stepY3){
      seg2(toS(p3(B.f0,B.l1,v)),toS(p3(B.f1,B.l1,v)));
      seg2(toS(p3(B.f1,B.l0,v)),toS(p3(B.f1,B.l1,v)));
    }
    ctx.strokeStyle="#b9c4d0";ctx.lineWidth=1.2;
    [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(e=>seg2(q[e[0]],q[e[1]]));
    ctx.fillStyle="#66788c";ctx.font="11px sans-serif";
    for(let v=Math.ceil(B.f0/stepF)*stepF;v<=B.f1;v+=stepF){
      const s=toS(p3(v,B.l0,B.y0));ctx.textAlign="center";ctx.fillText(fmtDist(v),s.sx,s.sy+14);
    }
    for(let v=Math.ceil(B.l0/stepL)*stepL;v<=B.l1;v+=stepL){
      const s=toS(p3(B.f0,v,B.y0));ctx.textAlign="right";ctx.fillText(fmtDist(v),s.sx-6,s.sy+4);
    }
    for(let v=Math.ceil(B.y0/stepY3)*stepY3;v<=B.y1;v+=stepY3){
      const s=toS(p3(0,B.l1,v));ctx.textAlign="right";ctx.fillText(fmtDist(v),s.sx-6,s.sy+4);
    }
    const xl=toS(p3(B.f1/2,B.l0,B.y0)), zl=toS(p3(B.f0,B.l1,B.y0)), yl=toS(p3(0,B.l1,B.y1));
    ctx.textAlign="center";ctx.fillText("前向距离 - X（米）",xl.sx,xl.sy+28);
    ctx.textAlign="right";ctx.fillText("横向距离 - Z（米）",zl.sx-8,zl.sy);
    ctx.textAlign="right";ctx.fillText("高度（米）",yl.sx-6,yl.sy-6);
  }
  // 极速参考（速度剖面）
  if(speedView&&S.current&&S.current.maxSpeed>0){
    ctx.strokeStyle="#188038";ctx.lineWidth=1.5;
    if(S.current.msfMap){
      ctx.setLineDash([4,4]);ctx.beginPath();
      let started=false;
      fr.forEach(f=>{
        const cap=S.current.maxSpeed*maxSpeedFactorAt(f.y,S.current.msfMap)*72;
        const s=toS({sx:f.fwd,sy:cap});
        started?ctx.lineTo(s.sx,s.sy):ctx.moveTo(s.sx,s.sy);started=true;
      });
      ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle="#188038";ctx.font="11px sans-serif";ctx.textAlign="left";
      ctx.fillText("极速（分层有效值）",padL+8,padT+14);
    } else {
      const cap=S.current.maxSpeed*72;
      const ys=toS({sx:0,sy:cap}).sy;
      ctx.setLineDash([4,4]);ctx.beginPath();
      ctx.moveTo(padL,ys);ctx.lineTo(w-padR,ys);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle="#188038";ctx.font="11px sans-serif";ctx.textAlign="left";
      ctx.fillText("极速 "+toKMH(S.current.maxSpeed).toFixed(0)+" km/h",padL+8,padT+14);
    }
  }
  // 目标轨迹（虚线）与红点
  if(currentParams().target&&!speedView){
    ctx.strokeStyle="#c5221f";ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.beginPath();
    let started=false;
    fr.forEach(f=>{
      if(f.tFwd===Infinity) return;
      const s=toS(proj({fwd:f.tFwd,lat:f.tLat,y:f.tY}));
      started?ctx.lineTo(s.sx,s.sy):ctx.moveTo(s.sx,s.sy);started=true;
    });
    ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle="#c5221f";
    let lastT=null;
    fr.forEach(f=>{
      if(f.tFwd===Infinity) return;
      const s=toS(proj({fwd:f.tFwd,lat:f.tLat,y:f.tY}));
      if(lastT&&Math.abs(s.sx-lastT.sx)+Math.abs(s.sy-lastT.sy)<8) return;
      ctx.beginPath();ctx.arc(s.sx,s.sy,2.2,0,7);ctx.fill();
      lastT=s;
    });
  }
  // 导弹轨迹（线 + 逐 Tick 蓝点）
  ctx.strokeStyle="#1a73e8";ctx.lineWidth=2.2;ctx.beginPath();
  pts.forEach((q,i)=>{const s=toS(q);i?ctx.lineTo(s.sx,s.sy):ctx.moveTo(s.sx,s.sy);});
  ctx.stroke();
  ctx.fillStyle="#1a73e8";
  let lastM=null;
  pts.forEach(q=>{
    const s=toS(q);
    if(lastM&&Math.abs(s.sx-lastM.sx)+Math.abs(s.sy-lastM.sy)<8) return;
    ctx.beginPath();ctx.arc(s.sx,s.sy,2.2,0,7);ctx.fill();
    lastM=s;
  });
  // 游标（导弹=蓝点）与目标=运动红点
  const cI=clamp(S.cursor,0,pts.length-1);
  const cS=toS(pts[cI]);
  ctx.fillStyle="#1a73e8";ctx.strokeStyle="#ffffff";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cS.sx,cS.sy,6,0,7);ctx.fill();ctx.stroke();
  if(currentParams().target&&!speedView){
    const tf=fr[cI];
    if(tf.tFwd!==Infinity){
      const tS=toS(proj({fwd:tf.tFwd,lat:tf.tLat,y:tf.tY}));
      ctx.fillStyle="#c5221f";ctx.strokeStyle="#ffffff";ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(tS.sx,tS.sy,6,0,7);ctx.fill();ctx.stroke();
    }
  }
  // 对比弹轨迹（虚线异色）与游标点；命中者在命中点画空心环标记
  (S.compare||[]).forEach(cp=>{
    if(!cp.result||cp.prof===S.current) return;
    const cpts=cp.result.frames.map(framePoint);
    ctx.strokeStyle=cp.color;ctx.lineWidth=1.8;ctx.setLineDash([3,3]);ctx.beginPath();
    cpts.forEach((q,i)=>{const s=toS(q);i?ctx.lineTo(s.sx,s.sy):ctx.moveTo(s.sx,s.sy);});
    ctx.stroke();ctx.setLineDash([]);
    if(cp.result.hitTick>=0){
      const hs=toS(framePoint(cp.result.frames[cp.result.hitTick]));
      ctx.strokeStyle=cp.color;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(hs.sx,hs.sy,7,0,7);ctx.stroke();
    }
    const ci=clamp(S.cursor,0,cpts.length-1),cs2=toS(cpts[ci]);
    ctx.fillStyle=cp.color;ctx.strokeStyle="#ffffff";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(cs2.sx,cs2.sy,4.5,0,7);ctx.fill();ctx.stroke();
  });
  // 结果标注（画布内）：命中黑点+文字 / 坠地 / 到时最小脱靶
  {
    let ax=null,ay=null,txt=null,col="#c5221f",dot=false;
    if(r.hitTick>=0){const hf=fr[r.hitTick],s=toS(framePoint(hf));ax=s.sx;ay=s.sy;txt="命中 "+(r.hitTick/TPS).toFixed(1)+" 秒";dot=true;}
    else if(r.impactTick>=0){const hf=fr[r.impactTick],s=toS(framePoint(hf));ax=s.sx;ay=s.sy;txt="坠地 "+(r.impactTick/TPS).toFixed(1)+" 秒";col="#6d4c41";}
    else if(fr.length){const lf=fr[fr.length-1],s=toS(framePoint(lf));ax=s.sx;ay=s.sy;txt="到时"+(isFinite(r.minMiss)?"最小脱靶 "+r.minMiss.toFixed(0)+" m":"");col="#66788c";}
    if(ax!=null&&txt&&txt.length>1){
      if(dot){ctx.fillStyle="#000";ctx.beginPath();ctx.arc(ax,ay,5,0,7);ctx.fill();}
      ctx.font="bold 12px sans-serif";ctx.textAlign="left";
      const tw=ctx.measureText(txt).width;
      ctx.fillStyle="rgba(255,255,255,.85)";ctx.fillRect(ax+8,ay-24,tw+8,18);
      ctx.fillStyle=col;ctx.fillText(txt,ax+12,ay-11);
    }
  }
  // 飞行标签（跟随弹体：名字 | 速度 | 航迹角）
  if(document.getElementById("flyLabel").checked&&S.current){
    const f=fr[cI];
    const txt=(S.current.enName||S.current.name).slice(0,14)+" | "+toKMH(f.speed).toFixed(0)+" km/h | "+(f.fpa>=0?"+":"")+f.fpa.toFixed(1)+"°";
    ctx.font="11px sans-serif";
    const tw=ctx.measureText(txt).width;
    let lx=cS.sx+12,ly2=cS.sy-30;
    if(lx+tw+10>w-4) lx=Math.max(4,cS.sx-tw-14);
    if(ly2<4) ly2=cS.sy+16;
    ctx.fillStyle="rgba(255,255,255,.88)";ctx.fillRect(lx-3,ly2-2,tw+6,15);
    ctx.fillStyle="#1c2733";ctx.textAlign="left";ctx.fillText(txt,lx,ly2+10);
  }
  S.chartMap={markerSX:cS.sx,markerSY:cS.sy,markerTX:null,markerTY:null,w,h,
    pts:pts.map((q,i)=>{const s=toS(q);return{i,sx:s.sx,sy:s.sy};})};
  if(currentParams().target&&!speedView){
    const tf=fr[cI];
    if(tf&&tf.tFwd!==Infinity){
      const tS=toS(proj({fwd:tf.tFwd,lat:tf.tLat,y:tf.tY}));
      S.chartMap.markerTX=tS.sx; S.chartMap.markerTY=tS.sy;
    }
  }
}
/* ---------- 曲线视图（时间序列；各序列独立归一化，图例标量程；X=秒） ---------- */
const CURVE_SERIES=[
  {k:"speed",label:"速度 km/h",color:"#1a73e8",get:f=>toKMH(f.speed)},
  {k:"mach",label:"马赫",color:"#0b8043",get:f=>toMach(f.speed)},
  {k:"alt",label:"高度 m",color:"#8d6e63",get:f=>f.y},
  {k:"distT",label:"到目标距离 m",color:"#c5221f",get:f=>f.distT},
  {k:"nG",label:"当前过载 G",color:"#e37400",get:f=>f.nG},
  {k:"alpha",label:"攻角 °",color:"#9334e6",get:f=>f.alphaDeg},
  {k:"availG",label:"可用最大过载 G",color:"#188038",get:f=>f.availG},
  {k:"thrust",label:"推力 N",color:"#0097a7",get:f=>f.thrust},
  {k:"drag",label:"阻力 N",color:"#5f6368",get:f=>f.drag},
  {k:"mass",label:"质量 kg",color:"#c26401",get:f=>f.mass},
];
function drawCurves(w,h){
  const r=S.result,fr=r.frames;
  const act=CURVE_SERIES.filter(s=>{const el=document.getElementById("cb_"+s.k);return el&&el.checked;});
  const padL=70,padR=24,padT=18,padB=44;
  const t1=Math.max((fr.length-1)/TPS,1e-6);
  const X=t=>padL+(t/TPS)/t1*(w-padL-padR);
  if(!act.length){
    ctx.fillStyle="#8a97a5";ctx.font="13px sans-serif";ctx.textAlign="center";
    ctx.fillText("左上角勾选至少一个曲线元素",w/2,h/2);
    S.chartMap={markerSX:padL,markerSY:h/2,pts:fr.map((f,i)=>({i,sx:X(f.t),sy:h/2})),w,h};
    return;
  }
  // 每序列量程（跳过 null/Inf；对比弹不参与量程，超界即裁剪——以当前弹为准）
  const rng=act.map(s=>{
    let lo=Infinity,hi=-Infinity;
    fr.forEach(f=>{const v=s.get(f);if(v==null||!isFinite(v))return;if(v<lo)lo=v;if(v>hi)hi=v;});
    if(!isFinite(lo)){lo=0;hi=1;}
    if(hi-lo<1e-9){lo-=1;hi+=1;}
    return {lo,hi};
  });
  ctx.lineWidth=1;ctx.strokeStyle="#e3e8ee";ctx.fillStyle="#66788c";ctx.font="11px sans-serif";
  for(let i=0;i<=5;i++){
    const y=padT+(h-padT-padB)*i/5;
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(w-padR,y);ctx.stroke();
  }
  const tStep=niceStep(t1,w-padL-padR);
  for(let v=0;v<=t1;v+=tStep){
    const sx=X(v*TPS);
    ctx.beginPath();ctx.moveTo(sx,padT);ctx.lineTo(sx,h-padB);ctx.stroke();
    ctx.textAlign="center";ctx.fillText(v.toFixed(0),sx,h-padB+16);
  }
  ctx.strokeStyle="#c7d0da";ctx.strokeRect(padL,padT,w-padL-padR,h-padT-padB);
  ctx.textAlign="center";ctx.fillText("时间（秒）",(padL+w-padR)/2,h-8);
  const Y=(v,rg)=>h-padB-(v-rg.lo)/(rg.hi-rg.lo)*(h-padT-padB);
  act.forEach((s,si)=>{
    const rg=rng[si];
    ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.beginPath();
    let started=false;
    fr.forEach(f=>{
      const v=s.get(f);if(v==null||!isFinite(v))return;
      const sx=X(f.t),sy=Y(v,rg);
      started?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy);started=true;
    });
    ctx.stroke();
    // 对比弹同序列虚线（按当前弹量程投影）
    (S.compare||[]).forEach(cp=>{
      if(!cp.result||cp.prof===S.current) return;
      ctx.strokeStyle=cp.color;ctx.lineWidth=1.2;ctx.setLineDash([3,3]);ctx.beginPath();
      let st2=false;
      cp.result.frames.forEach(f=>{
        const v=s.get(f);if(v==null||!isFinite(v))return;
        const sx=X(f.t),sy=Y(v,rg);
        st2?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy);st2=true;
      });
      ctx.stroke();ctx.setLineDash([]);
    });
  });
  // 图例（画布左侧，避开左上角 HTML 勾选面板，含量程）+ 各弹交战判定
  ctx.font="11px sans-serif";ctx.textAlign="left";
  let ly=padT+158;
  act.forEach((s,si)=>{
    const rg=rng[si],dec=rg.hi>=100?0:1;
    ctx.fillStyle=s.color;ctx.fillRect(padL+8,ly-8,14,3);
    ctx.fillStyle="#1c2733";
    ctx.fillText(s.label+"： "+rg.lo.toFixed(dec)+" ~ "+rg.hi.toFixed(dec),padL+28,ly);
    ly+=16;
  });
  ly+=6;
  const verdictLine=(name,color,r)=>{
    ctx.fillStyle=color;ctx.fillRect(padL+8,ly-8,14,3);
    ctx.fillStyle=verdictColor(r);
    ctx.fillText(name+"： "+verdictTxt(r),padL+28,ly);
    ly+=16;
  };
  if(S.result&&S.current) verdictLine(S.current.name,"#1a73e8",S.result);
  (S.compare||[]).forEach(c=>{ if(c.result&&c.prof!==S.current) verdictLine(c.prof.name,c.color,c.result); });
  // 游标竖线
  const cI=clamp(S.cursor,0,fr.length-1);
  const cx=X(fr[cI].t);
  ctx.strokeStyle="#1a73e8";ctx.lineWidth=1.5;ctx.setLineDash([5,3]);
  ctx.beginPath();ctx.moveTo(cx,padT);ctx.lineTo(cx,h-padB);ctx.stroke();ctx.setLineDash([]);
  S.chartMap={markerSX:cx,markerSY:h/2,pts:fr.map((f,i)=>({i,sx:X(f.t),sy:h/2})),w,h};
}
function q3s(fx,ly,ys){ return proj3Raw(fx,ly,ys); }
function proj3Raw(fx,ly,ys){
  const yaw=rad(parseFloat(document.getElementById("viewYaw").value)||35);
  const cs=Math.cos(yaw),sn=Math.sin(yaw);
  return {sx:fx*cs-ly*sn,sy:(fx*sn+ly*cs)*0.45-ys};
}

/* ---------- 游标 / 时间轴 / 播放 ---------- */
function updateCursor(){
  if(!S.result||!S.result.frames.length) return;
  const fr=S.result.frames;
  S.cursor=clamp(S.cursor,0,fr.length-1);
  document.getElementById("scrub").value=S.cursor;
  const f=fr[S.cursor];
  document.getElementById("timeLabel").textContent=(f.t/TPS).toFixed(2)+"s / "+((fr.length-1)/TPS).toFixed(2)+"s";
  const tt=document.getElementById("tooltip");
  if(S.playing||tt.style.display==="block"){
    tt.textContent=
      "时间: "+(f.t/TPS).toFixed(2)+" 秒（Tick "+f.t+"）\n"+
      "前向距离: "+Math.round(f.fwd)+" 米\n"+
      "高度: "+Math.round(f.y)+" 米\n"+
      "速度: "+f.speed.toFixed(2)+" 格/Tick = "+toKMH(f.speed).toFixed(0)+" km/h（M"+toMach(f.speed).toFixed(2)+"）\n"+
      "加速度: "+f.accel.toFixed(1)+" m/s²\n"+
      "G 载荷: "+f.nG.toFixed(2)+" G\n"+
      "攻角: "+f.alphaDeg.toFixed(2)+"°\n"+
      "到目标距离: "+(isFinite(f.distT)?Math.round(f.distT)+" 米":"—")+"\n"+
      "已行驶距离: "+Math.round(f.traveled)+" 米"+
      (f.sp===1?"\n[二脉冲燃烧中]":(f.sp===2?"\n[二脉冲已结束]":""));
    tt.style.display="block";
    // 播放时信息面板跟随弹体标记（悬停时保持鼠标位置不动）
    if(S.playing&&S.chartMap){
      let lx=S.chartMap.markerSX+16,ly=S.chartMap.markerSY-20;
      if(ly+210>S.chartMap.h-8) ly=Math.max(8,S.chartMap.markerSY+18);
      if(lx+250>S.chartMap.w-8) lx=S.chartMap.markerSX-260;
      tt.style.left=Math.max(8,lx)+"px";
      tt.style.top=Math.max(8,ly)+"px";
    }
  }
  draw();
}
cv.addEventListener("mousemove",ev=>{
  if(S.playing) return; // 播放中信息面板由弹体标记接管
  if(!S.result||!S.chartMap||!S.chartMap.pts) return;
  const box=cv.getBoundingClientRect();
  const tt=document.getElementById("tooltip");
  tt.style.display="block";
  tt.style.left=Math.min(ev.clientX-box.left+16,box.width-240)+"px";
  tt.style.top=Math.min(ev.clientY-box.top+8,box.height-210)+"px";
  const mx=ev.clientX-box.left,my=ev.clientY-box.top;
  let best=0,bd=Infinity;
  S.chartMap.pts.forEach(q=>{
    const d=(q.sx-mx)*(q.sx-mx)+(q.sy-my)*(q.sy-my);
    if(d<bd){bd=d;best=q.i;}
  });
  if(S.cursor!==best){ S.cursor=best; updateCursor(); }
});
cv.addEventListener("mouseleave",()=>{ if(!S.playing) document.getElementById("tooltip").style.display="none"; });
document.getElementById("scrub").addEventListener("input",e=>{ S.cursor=parseInt(e.target.value)||0; updateCursor(); });
document.getElementById("btnStep").addEventListener("click",()=>{ if(S.result){ S.cursor++; updateCursor(); } });
document.getElementById("btnReset").addEventListener("click",()=>{ S.cursor=0; updateCursor(); });
document.getElementById("btnPlay").addEventListener("click",()=>{
  if(!S.result) return;
  S.playing=!S.playing;
  document.getElementById("btnPlay").textContent=S.playing?"⏸":"▶";
  if(S.playing){
    if(S.cursor>=S.result.frames.length-1) S.cursor=0;
    S.acc=0;
    S.lastT=performance.now();
    requestAnimationFrame(step);
  }
});
function step(now){
  if(!S.playing||!S.result) return;
  const dt=Math.min((now-S.lastT)/1000,0.1); S.lastT=now; // 后台标签页回切的大 dt 钳制
  S.acc=(S.acc||0)+dt*TPS*S.speed;                        // 亚 Tick 累加：0.5×/1× 下按真实速率攒步
  const adv=Math.floor(S.acc);
  if(adv>0){ S.acc-=adv; S.cursor=clamp(S.cursor+adv,0,S.result.frames.length-1); updateCursor(); }
  if(S.cursor>=S.result.frames.length-1){ S.playing=false; S.acc=0; document.getElementById("btnPlay").textContent="▶"; return; }
  requestAnimationFrame(step);
}
document.getElementById("playSpeed").addEventListener("change",e=>{ S.speed=parseFloat(e.target.value)||1; S.acc=0; });

/* ---------- 事件绑定 ---------- */
document.getElementById("pickDir").addEventListener("click",pickDirectory);
document.getElementById("loadDemo").addEventListener("click",loadDemo);
document.getElementById("dirFallback").addEventListener("change",onFallbackFiles);
document.getElementById("search").addEventListener("input",e=>fillMissileOptions(e.target.value));
document.getElementById("missileSelect").addEventListener("change",selectMissile);
document.getElementById("viewMode").addEventListener("change",e=>{
  document.getElementById("curveBox").style.display=e.target.value==="curves"?"block":"none";
  draw();
});
document.getElementById("cmpBtn").addEventListener("click",()=>{
  if(!S.current) return;
  const i=S.compare.findIndex(c=>c.prof===S.current);
  if(i>=0) S.compare.splice(i,1);
  else if(S.compare.length<4) S.compare.push({prof:S.current,result:null,color:CMP_COLORS[S.compare.length%CMP_COLORS.length]});
  updateCmpBtn(); updateLegend(); recompute();
});
document.getElementById("presetSel").addEventListener("change",e=>{
  const p=PRESETS[e.target.value]; if(!p) return;
  const set=(id,v)=>document.getElementById(id).value=v;
  set("carrierSpeed",p.carrierSpeed); set("launchAlt",p.launchAlt);
  set("launchAngle",p.launchAngle); set("launchYaw",p.launchYaw);
  document.getElementById("targetOn").checked=p.target;
  set("tgtSpeed",p.tgtSpeed); set("tgtAlt",p.tgtAlt); set("tgtDist",p.tgtDist);
  set("tgtBearing",p.tgtBearing); set("tgtHeading",p.tgtHeading);
  set("tgtClimb",p.tgtClimb); set("tgtTurnG",p.tgtTurnG);
  recompute();
});
CURVE_SERIES.forEach(s=>document.getElementById("cb_"+s.k).addEventListener("change",draw));
document.getElementById("flyLabel").addEventListener("change",draw);
document.getElementById("viewYaw").addEventListener("input",draw);
document.getElementById("viewZoom").addEventListener("input",draw);
document.getElementById("equalAspect").addEventListener("change",draw);
["carrierSpeed","launchAlt","launchAngle","launchYaw","groundY","tgtRadius","targetOn","tgtSpeed","tgtAlt","tgtDist","tgtBearing","tgtHeading","tgtClimb","tgtTurnG","maxSeconds"]
  .forEach(id=>document.getElementById(id).addEventListener("change",recompute));
window.addEventListener("resize",draw);
window.addEventListener("error",e=>{const s=document.getElementById("statusBar");if(s)s.textContent="脚本错误: "+e.message+" @行"+(e.lineno||"?");});

/* 启动即注入示例弹家族，导弹下拉无需选目录即可用 */
injectDemoProfiles();
fillMissileOptions("");

draw();
