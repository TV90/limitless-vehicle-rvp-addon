// 独立诊断入口：复用项目真实 Minecraft 类路径，不改正式构建任务或发布内容。
allprojects { lightingProject ->
    afterEvaluate {
        if (lightingProject != lightingProject.rootProject) { return }
        def lightingNativeRoot = new File(gradle.gradleUserHomeDir,
                'caches/forge_gradle/maven_downloader/org/lwjgl')
        def lightingNatives = ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl'].collect { module ->
            new File(lightingNativeRoot, "${module}/3.3.1/${module}-3.3.1-natives-windows.jar")
        }
        // DH / 屏幕光 / 冲击波状态交接回归，额外验证作用域退出后的下一次引擎调用。
        def stateOutput = lightingProject.layout.buildDirectory.dir('screen-effect-state-gpu-regression/classes')
        def stateCompile = tasks.register('compileScreenEffectStateGpuRegression', JavaCompile) {
            dependsOn tasks.named('classes')
            source = lightingProject.files(new File(lightingProject.projectDir,
                    'scripts/diagnostics/ScreenEffectStateGpuRegression.java'), new File(lightingProject.projectDir,
                    'scripts/diagnostics/ScreenLightOcclusionGpuRegression.java'), new File(lightingProject.projectDir,
                    'scripts/diagnostics/ScreenLightShaderSources.java'))
            classpath = sourceSets.test.runtimeClasspath
            destinationDirectory.set(stateOutput)
            options.encoding = 'UTF-8'
            javaCompiler.set(javaToolchains.compilerFor { languageVersion.set(JavaLanguageVersion.of(17)) })
        }
        tasks.register('screenEffectStateGpuRegression', JavaExec) {
            dependsOn stateCompile
            classpath = sourceSets.test.runtimeClasspath + lightingProject.files(stateOutput) + lightingProject.files(lightingNatives)
            mainClass.set('org.ywzj.rvp.client.light.ScreenEffectStateGpuRegression')
            args lightingProject.projectDir.absolutePath
            javaLauncher.set(javaToolchains.launcherFor { languageVersion.set(JavaLanguageVersion.of(17)) })
            systemProperty 'org.lwjgl.system.SharedLibraryExtractPath',
                    layout.buildDirectory.dir('screen-effect-state-gpu-regression/natives').get().asFile.absolutePath
        }
        def lightingOutput = lightingProject.layout.buildDirectory.dir('screen-light-frame-gpu-regression/classes')
        def lightingCompile = tasks.register('compileLightingFrameGpuRegression', JavaCompile) {
            dependsOn tasks.named('classes')
            source = lightingProject.files(new File(lightingProject.projectDir,
                    'scripts/diagnostics/ScreenLightFrameGpuRegression.java'))
            classpath = sourceSets.test.runtimeClasspath
            destinationDirectory.set(lightingOutput)
            options.encoding = 'UTF-8'
            javaCompiler.set(javaToolchains.compilerFor { languageVersion.set(JavaLanguageVersion.of(17)) })
        }
        tasks.register('lightingFrameGpuRegression', JavaExec) {
            dependsOn lightingCompile
            classpath = sourceSets.test.runtimeClasspath + lightingProject.files(lightingOutput) + lightingProject.files(lightingNatives)
            mainClass.set('org.ywzj.rvp.client.light.ScreenLightFrameGpuRegression')
            javaLauncher.set(javaToolchains.launcherFor { languageVersion.set(JavaLanguageVersion.of(17)) })
            systemProperty 'org.lwjgl.system.SharedLibraryExtractPath',
                    layout.buildDirectory.dir('screen-light-frame-gpu-regression/natives').get().asFile.absolutePath
        }
        // 尾焰深度复现与修复回归：真实 Minecraft 状态片段 + 正式 GLSL，不启动游戏世界。
        def motorOutput = lightingProject.layout.buildDirectory.dir('motor-flame-depth-gpu-regression/classes')
        def motorCompile = tasks.register('compileMotorFlameDepthGpuRegression', JavaCompile) {
            dependsOn tasks.named('classes')
            source = lightingProject.files(
                    new File(lightingProject.projectDir, 'scripts/diagnostics/MotorFlameDepthGpuRegression.java'),
                    new File(lightingProject.projectDir, 'scripts/diagnostics/ScreenLightShaderSources.java'),
                    new File(lightingProject.projectDir, 'scripts/diagnostics/ScreenLightGpuRegression.java'))
            classpath = sourceSets.test.runtimeClasspath
            destinationDirectory.set(motorOutput)
            options.encoding = 'UTF-8'
            javaCompiler.set(javaToolchains.compilerFor { languageVersion.set(JavaLanguageVersion.of(17)) })
        }
        tasks.register('motorFlameDepthGpuRegression', JavaExec) {
            dependsOn motorCompile
            classpath = sourceSets.test.runtimeClasspath + lightingProject.files(motorOutput) + lightingProject.files(lightingNatives)
            mainClass.set('org.ywzj.rvp.client.light.MotorFlameDepthGpuRegression')
            args lightingProject.projectDir.absolutePath
            javaLauncher.set(javaToolchains.launcherFor { languageVersion.set(JavaLanguageVersion.of(17)) })
            systemProperty 'org.lwjgl.system.SharedLibraryExtractPath',
                    layout.buildDirectory.dir('motor-flame-depth-gpu-regression/natives').get().asFile.absolutePath
        }
        // 提前爆炸烟：真实材质深度规则 + 帧快照 + 正式光照 GLSL，防止只测“采集后画烟”的漏测。
        def smokeOutput = lightingProject.layout.buildDirectory.dir('explosion-smoke-depth-gpu-regression/classes')
        def smokeCompile = tasks.register('compileExplosionSmokeDepthGpuRegression', JavaCompile) {
            dependsOn tasks.named('classes')
            source = lightingProject.files(
                    new File(lightingProject.projectDir, 'scripts/diagnostics/ExplosionSmokeDepthGpuRegression.java'),
                    new File(lightingProject.projectDir, 'scripts/diagnostics/ScreenLightShaderSources.java'),
                    new File(lightingProject.projectDir, 'scripts/diagnostics/ScreenLightGpuRegression.java'))
            classpath = sourceSets.test.runtimeClasspath
            destinationDirectory.set(smokeOutput)
            options.encoding = 'UTF-8'
            javaCompiler.set(javaToolchains.compilerFor { languageVersion.set(JavaLanguageVersion.of(17)) })
        }
        tasks.register('explosionSmokeDepthGpuRegression', JavaExec) {
            dependsOn smokeCompile
            classpath = sourceSets.test.runtimeClasspath + lightingProject.files(smokeOutput) + lightingProject.files(lightingNatives)
            mainClass.set('org.ywzj.rvp.client.light.ExplosionSmokeDepthGpuRegression')
            args lightingProject.projectDir.absolutePath
            javaLauncher.set(javaToolchains.launcherFor { languageVersion.set(JavaLanguageVersion.of(17)) })
            systemProperty 'org.lwjgl.system.SharedLibraryExtractPath',
                    layout.buildDirectory.dir('explosion-smoke-depth-gpu-regression/natives').get().asFile.absolutePath
        }
        // 烟内外可见性：实际 Java 选择器 + 正式体积烟 GLSL，单独验证多团近烟不会挤掉烟外体积。
        def trailInteriorOutput = lightingProject.layout.buildDirectory.dir('rocket-trail-interior-gpu-regression/classes')
        def trailInteriorCompile = tasks.register('compileRocketTrailInteriorGpuRegression', JavaCompile) {
            dependsOn tasks.named('classes')
            source = lightingProject.files(
                    new File(lightingProject.projectDir, 'scripts/diagnostics/RocketTrailVolumeGpuRegression.java'),
                    new File(lightingProject.projectDir, 'scripts/diagnostics/ScreenLightShaderSources.java'),
                    new File(lightingProject.projectDir, 'scripts/diagnostics/RocketTrailInteriorGpuRegression.java'))
            classpath = sourceSets.test.runtimeClasspath
            destinationDirectory.set(trailInteriorOutput)
            options.encoding = 'UTF-8'
            javaCompiler.set(javaToolchains.compilerFor { languageVersion.set(JavaLanguageVersion.of(17)) })
        }
        tasks.register('rocketTrailInteriorGpuRegression', JavaExec) {
            dependsOn trailInteriorCompile
            classpath = sourceSets.test.runtimeClasspath + lightingProject.files(trailInteriorOutput) + lightingProject.files(lightingNatives)
            mainClass.set('org.ywzj.rvp.client.light.RocketTrailInteriorGpuRegression')
            args lightingProject.projectDir.absolutePath
            javaLauncher.set(javaToolchains.launcherFor { languageVersion.set(JavaLanguageVersion.of(17)) })
            systemProperty 'org.lwjgl.system.SharedLibraryExtractPath',
                    layout.buildDirectory.dir('rocket-trail-interior-gpu-regression/natives').get().asFile.absolutePath
        }
        // 通用性能记录：真实时间戳后端、正式程序爆炸及独立后台日志，不启动Minecraft世界。
        def performanceOutput = lightingProject.layout.buildDirectory.dir('render-performance-gpu-regression/classes')
        def performanceCompile = tasks.register('compileRenderPerformanceGpuRegression', JavaCompile) {
            dependsOn tasks.named('classes')
            source = lightingProject.files(
                    new File(lightingProject.projectDir, 'scripts/diagnostics/RenderPerformanceGpuRegression.java'),
                    new File(lightingProject.projectDir, 'scripts/diagnostics/VehicleExplosionGpuRegression.java'))
            classpath = sourceSets.test.runtimeClasspath
            destinationDirectory.set(performanceOutput)
            options.encoding = 'UTF-8'
            javaCompiler.set(javaToolchains.compilerFor { languageVersion.set(JavaLanguageVersion.of(17)) })
        }
        tasks.register('renderPerformanceGpuRegression', JavaExec) {
            dependsOn performanceCompile
            classpath = sourceSets.test.runtimeClasspath + lightingProject.files(performanceOutput) + lightingProject.files(lightingNatives)
            mainClass.set('org.ywzj.rvp.client.performance.RenderPerformanceGpuRegression')
            args lightingProject.projectDir.absolutePath
            javaLauncher.set(javaToolchains.launcherFor { languageVersion.set(JavaLanguageVersion.of(17)) })
            systemProperty 'org.lwjgl.system.SharedLibraryExtractPath',
                    layout.buildDirectory.dir('render-performance-gpu-regression/natives').get().asFile.absolutePath
        }
    }
}
