<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="aui-font-mode" content="web">
    <meta name="aui-viewport" content="mode=browser, zoom=1, min-zoom=1, max-zoom=1, user-scalable=false">
    <style>
        * { box-sizing:border-box; }
        html, body { width:100%; height:100%; margin:0; background-color:transparent; overflow:hidden; }
        body { display:flex; align-items:center; justify-content:center; font-family:"Microsoft YaHei","Segoe UI",sans-serif; color:#f4f4f2; font-size:17px; }
        button { padding:0; margin:0; border:0; border-radius:0; color:inherit; font-family:inherit; font-size:inherit; text-align:left; cursor:pointer; }
        .frame { font-size:var(--eq-base,17px); width:86%; max-width:1520px; height:72%; max-height:780px; display:flex; flex-direction:column; gap:7px; }
        .head, .head-end, .columns, .tabs, .category, .part, .legend, .queue-row { display:flex; align-items:center; }
        .head { height:43px; flex:0 0 43px; width:100%; }
        .dark, .category, .tab, .close, .queue-row {
            background-color:transparent; background-image:linear-gradient(180deg,rgba(47,48,53,.83) 0%,rgba(30,31,36,.77) 45%,rgba(18,19,24,.75) 100%); }
        .silver, .category.selected, .tab.selected { color:#191b1e; background-color:transparent;
            background-image:linear-gradient(180deg,rgba(250,250,248,.93) 0%,rgba(240,240,238,.91) 40%,rgba(215,216,219,.89) 80%,rgba(199,200,203,.88) 100%); }
        .title-tab { height:100%; flex:0 0 auto; display:flex; align-items:center; padding:0 20px; font-weight:bold; font-size:var(--eq-title,22px);
            clip-path:polygon(0 30%,9px 0,100% 0,100% 100%,0 100%); }
        #vehicle-name { flex:1 1 auto; min-width:0; margin:0 12px; overflow:hidden; white-space:nowrap; font-size:var(--eq-title,22px); }
        .head-end { flex:0 0 auto; gap:9px; height:100%; padding-right:5px; }
        #hp-text { font-size:var(--eq-detail,15px); white-space:nowrap; }
        .hp-track { width:76px; height:4px; background-color:#62636a; }
        #hp-fill { height:100%; background-color:#eeeee9; }
        .close { width:35px; height:31px; text-align:center; border:1px solid #726e64; font-size:var(--eq-title,22px); }
        .columns { flex:1 1 auto; min-height:0; width:100%; align-items:stretch; gap:7px; }
        .col { display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden;
            background-color:transparent; background-image:linear-gradient(180deg,rgba(20,22,29,.60),rgba(24,24,32,.50)); }
        .parts { flex:0 0 30%; }
        .drawing { flex:1 1 0; }
        .repair { flex:0 0 28%; }
        .label { min-height:31px; flex:0 0 auto; padding:5px 10px; font-size:var(--eq-heading,19px); font-weight:bold; }
        .rule { border-bottom:1px solid rgba(199,194,179,.47); }
        .scroll { min-height:0; overflow-y:auto; overflow-x:hidden; }
        #categories { flex:0 1 38%; border-bottom:1px solid #928a78; }
        .category, .part, .queue-row { width:100%; min-width:0; min-height:33px; padding:4px 8px; gap:5px; border-bottom:1px solid rgba(194,190,179,.27); }
        .category:not(.selected), .queue-row { background-image:linear-gradient(180deg,rgba(51,52,59,.51),rgba(22,23,28,.34)); }
        .category.selected { font-weight:bold; }
        .category:hover, .tab:hover, .close:hover, .part.action:hover, .queue-x:hover { background-image:linear-gradient(180deg,#55585e,#35373c); color:#fff; }
        .category.selected:hover, .tab.selected:hover { background-image:linear-gradient(180deg,#fff,#d4d5da); color:#16171a; }
        .name { flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
        .summary { flex:0 0 auto; font-size:var(--eq-detail,15px); }
        #parts-list, #queue-list { flex:1 1 0; display:flex; flex-direction:column; }
        .part, .queue-row { flex:0 0 auto; }
        .part { cursor:default; background-color:rgba(18,19,24,.18); }
        .part.action { cursor:pointer; }
        .idx { width:20px; flex:0 0 20px; text-align:center; color:#bebebc; font-size:var(--eq-detail,15px); }
        .part-name { flex:1 1 auto; min-width:0; white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.15; }
        .hint, .empty { color:#c6c7c8; font-size:var(--eq-detail,15px); }
        .status { flex:0 0 auto; font-size:var(--eq-detail,15px); }
        .damaged { color:#f2bd73; } .bad { color:#ff9c91; }
        .canvas-wrap { position:relative; flex:1 1 auto; min-height:0; margin:8px; }
        #skeleton-canvas { position:absolute; left:0; top:0; width:100%; height:100%; }
        .legend { flex:0 0 auto; justify-content:center; gap:12px; padding:6px 0; font-size:var(--eq-detail,15px); }
        .key { display:flex; align-items:center; gap:4px; white-space:nowrap; }
        .swatch { width:8px; height:8px; border:1px solid #eee; }
        .swatch.worn { border-color:#ff9900; } .swatch.failed { border-color:#ff4d43; }
        .tabs { flex:0 0 auto; gap:2px; padding:6px; }
        .tab { display:flex; align-items:center; justify-content:center; flex:1 1 0; min-width:0; height:30px; text-align:center; border-bottom:1px solid #9c9480; }
        .queue-row { min-height:30px; }
        .queue-x { flex:0 0 30px; height:25px; background-color:transparent; color:#eee; text-align:center; }
        .empty, .hint, #repair-forecast { padding:6px 9px; line-height:1.35; overflow-wrap:anywhere; }
        .repair-foot { flex:0 0 auto; border-top:1px solid rgba(200,193,175,.4); }
        #repair-forecast { font-size:var(--eq-detail,15px); } .hint { padding-top:0; }
        .frame.compact { width:94%; height:81%; max-height:none; }
        .compact .head { height:52px; flex-basis:52px; }
        .compact .tab, .compact .close { height:40px; }
        .compact .part-name { line-height:1.2; }
        .hidden { display:none; }
        @media (max-width:760px) {
            .frame { width:96%; } .title-tab { padding:0 9px; } .hp-track { display:none; }
            .parts { flex-basis:32%; } .repair { flex-basis:29%; }
            .category, .part, .queue-row { padding:3px 4px; } .legend { gap:5px; }
        }
        @media (max-height:510px) {
            .frame { height:84%; gap:3px; } .head { height:30px; flex-basis:30px; } .label { min-height:22px; padding:2px 6px; }
            .category, .part, .tab, .queue-row { min-height:21px; } .hint { font-size:14px; } .tabs { padding:3px; }
        }
    </style>
</head>
<body>
    <main class="frame" id="equipment-frame">
        <header class="head dark"><div class="title-tab silver"><translation>gui.ywzj_rvp.equipment.title</translation></div>
            <div id="vehicle-name"></div><div class="head-end"><span id="hp-text"></span><div class="hp-track"><div id="hp-fill"></div></div>
            <button id="close-button" class="close" type="button" aria-label="Close">×</button></div></header>
        <div class="columns">
            <section class="col parts"><div class="label dark rule"><translation>gui.ywzj_rvp.equipment.parts</translation></div>
                <div id="categories" class="scroll"></div><div id="parts-list" class="scroll"></div></section>
            <section class="col drawing"><div class="label dark rule"><translation>gui.ywzj_rvp.equipment.skeleton</translation></div>
                <div class="canvas-wrap"><div id="skeleton-canvas"></div></div>
                <div class="legend"><span class="key"><i class="swatch"></i><translation>gui.ywzj_rvp.equipment.state_ok</translation></span>
                    <span class="key"><i class="swatch worn"></i><translation>gui.ywzj_rvp.equipment.state_damaged</translation></span>
                    <span class="key"><i class="swatch failed"></i><translation>gui.ywzj_rvp.equipment.state_bad</translation></span></div></section>
            <section id="maint-panel" class="col repair"><div class="label silver"><translation>gui.ywzj_rvp.equipment.repair_order</translation></div>
                <div class="tabs"><button id="era-tab" type="button" class="tab"><translation>gui.ywzj_rvp.equipment.era_tab</translation></button>
                    <button id="dev-tab" type="button" class="tab"><translation>gui.ywzj_rvp.equipment.device_tab</translation></button></div>
                <div id="queue-list" class="scroll"></div><footer class="repair-foot"><div id="repair-forecast"></div>
                <div class="hint"><translation>gui.ywzj_rvp.equipment.queue_hint</translation></div></footer></section>
        </div>
    </main>
</body>
</html>
