<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="aui-font-mode" content="web">
    <meta name="aui-viewport" content="mode=browser">
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background-color: transparent; }
        body { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; color: #f4f6f7; font-size: 14px; }
        button, input { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: inherit; }
        button { cursor: pointer; text-align: left; color: inherit; }
        .top { position: absolute; left: 18.4%; top: 2.4%; width: 63.3%; height: 4.2%; display: flex; align-items: stretch; }
        #vehicle-title, .section-label, .tab, .bar, .foot { border-radius: 0; text-align: center; font-size: 19px; line-height: 1.13; }
        #vehicle-title, .section-label { display: flex; align-items: center; justify-content: center; min-width: 0; white-space: nowrap; overflow: hidden; padding: 1px 12px; border: 0; }
        #vehicle-title { flex: 0 1 44%; justify-content: flex-start; font-weight: bold; }
        .section-label { flex: 1 1 56%; color: #d5d6d3; border-left: 1px solid #827b67; }
        .section-label, .tab, .foot { background-color: #242428; background-image: linear-gradient(180deg, #35363b 0%, #25262b 42%, #16161b 100%); }
        .side { position: absolute; left: 0.9%; top: 9.8%; width: 23.7%; max-height: 83%; display: flex; flex-direction: column; }
        .tabs { display: flex; width: 100%; gap: 2px; flex: 0 0 auto; padding: 0 1px 4px; border-bottom: 1px solid rgba(216,219,219,0.58); }
        .tab { position: relative; flex: 1 1 0; height: 38px; padding: 2px 5px; border: 0; color: #dededc; font-weight: bold; clip-path: polygon(0 30%, 4% 0, 100% 0, 100% 100%, 0 100%); }
        .tab, .foot { display: flex; justify-content: center; align-items: center; }
        .tab-notch { position: absolute; top: 1px; right: 1px; width: 13px; height: 13px; background-color: #ad813d; clip-path: polygon(0 0, 100% 0, 100% 100%); }
        .tab.current .tab-notch { display: none; }
        .slots, .choices { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow-y: auto; }
        .slots { flex: 0 1 auto; }
        .slot, .option { display: flex; width: 100%; min-width: 0; flex: 0 0 auto; margin: 0; padding: 0; border-radius: 0; color: #faf9f5; background-color: transparent; text-shadow: none; }
        .slot { flex-direction: column; align-items: stretch; margin-top: 4px; border: 1px solid rgba(178,170,150,0.76); box-shadow: 0 0 2px rgba(19,18,21,0.42); }
        .caption, .load { display: flex; width: 100%; min-width: 0; min-height: 30px; align-items: center; }
        .caption, .load, .option, .damage-select, .aui-select-option { background-color: #23252a; background-image: linear-gradient(180deg, rgba(49,51,56,0.98), rgba(27,29,33,0.98) 58%, rgba(31,32,37,0.96)); }
        .caption, .value, .option-name { overflow: hidden; white-space: nowrap; font-size: 19px; line-height: 1.13; }
        .ticker-frame { display: flex; justify-content: flex-start; align-items: center; min-width: 0; overflow: hidden; white-space: nowrap; text-align: left; }
        .ticker-text { display: block; flex: 0 0 auto; white-space: nowrap; font-size: inherit; font-weight: inherit; pointer-events: none; }
        .caption { padding: 3px 8px; color: #eeeDEa; }
        .load { border-top: 1px solid rgba(171,170,164,0.55); }
        .value { flex: 1 1 auto; min-width: 0; padding: 3px 8px; }
        .bay, .plaque, .option-art, .detail-art { display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .bay { flex: 0 0 25%; height: 29px; border-left: 1px solid rgba(209,196,161,0.68); }
        .plaque { display: none; height: 128px; width: 100%; border-top: 1px solid rgba(158,159,160,0.50); }
        .slot.active .plaque { display: flex; background-image: linear-gradient(180deg, #f9f9f7, #e7e8e8 70%, #cfd0d3); }
        .slot.active .bay { display: none; }
        .option-panel { position: absolute; left: 25.5%; top: 16.2%; width: 23.9%; max-height: 71%; display: flex; flex-direction: column; }
        .choices { flex: 0 1 auto; }
        .option { align-items: center; min-height: 36px; border: 0; border-bottom: 1px solid rgba(96,95,92,0.72); }
        .option-art { flex: 0 0 25%; height: 30px; }
        .option-name { flex: 1 1 auto; min-width: 0; padding: 4px 6px; }
        /* ApricityUI 将键盘高亮写进行内背景色，弹出行没有独立的焦点属性。 */
        .slot:hover .caption, .slot:hover .load, .option:hover, .tab:hover, .foot:hover, .damage-select:hover,
        .aui-select-option:hover, .aui-select-option[style*="#1967d2"] { background-image: linear-gradient(180deg, #55585e, #363940 65%, #303137); }
        #vehicle-title, .bar, .tab.current, .slot.active .caption, .slot.active .load, .option.active, .foot:focus-visible, .aui-select-option[aria-selected="true"] {
            color: #15171b; background-color: #e3e4e3;
            background-image: linear-gradient(180deg, #fafaf8 0%, #f0f0ee 40%, #d7d8db 80%, #c7c8cb 100%);
        }
        .slot.active .caption, .option.active .option-name { font-weight: bold; }
        .slot.active .load { border-top-color: rgba(151,151,148,0.45); }
        .slot:focus-visible, .option:focus-visible, .tab:focus-visible { outline: 1px solid #c7aa70; }
        .bar { flex: 0 0 auto; min-height: 31px; padding: 5px 8px; text-align: left; font-weight: bold; }
        .art-mark { position: relative; display: block; width: 44px; height: 23px; }
        .mark-back, .mark-front { position: absolute; display: block; width: 69%; height: 56%; border: 1.5px solid #e2e4e5; border-radius: 2px; }
        .mark-back { top: 11%; left: 8%; border-right: 0; border-bottom: 0; }
        .mark-front { top: 31%; left: 23%; }
        .plaque .art-mark, .detail-art .art-mark { width: 116px; height: 62px; }
        .plaque .mark-back, .plaque .mark-front, .detail-art .mark-back, .detail-art .mark-front { border-width: 3px; border-radius: 4px; }
        .slot.active .mark-back, .slot.active .mark-front, .option.active .mark-back, .option.active .mark-front { border-color: #323437; }
        .art-image { display: block; width: 82%; height: 84%; object-fit: contain; }
        .plaque .art-image, .detail-art .art-image { width: 70%; height: 82%; }
        .art-chip { width: 68%; height: 52%; border: 1px solid rgba(214,214,209,0.48); }
        .plaque .art-chip { width: 35%; height: 37%; }
        .detail { position: absolute; right: 1.8%; top: 12.4%; width: 23.9%; height: 80.7%; overflow-y: auto; padding: 13px 17px;
            border: 0; outline: 0; box-shadow: none; background-color: transparent; backdrop-filter: blur(7px);
            background-image: linear-gradient(180deg, rgba(26,28,35,0.82), rgba(33,34,43,0.69) 35%, rgba(38,36,45,0.54) 72%, rgba(37,32,40,0.46));
        }
        #detail-title { margin: 0 0 6px; overflow-wrap: anywhere; font-size: 24px; line-height: 1.18; font-weight: bold; color: #fff; }
        .detail-art { width: 100%; height: 97px; margin-bottom: 6px; }
        #detail-copy { color: #f0f0ed; font-size: 18px; line-height: 1.32; overflow-wrap: anywhere; }
        #facts { margin-top: 7px; }
        .fact { display: flex; justify-content: space-between; align-items: center; gap: 6px; min-height: 28px; padding: 4px 0; border-top: 1px solid rgba(219,217,210,0.20); }
        .fact-name { color: #d5d5d3; font-size: 15px; }
        .fact-value { color: #fff; font-size: 17px; font-weight: bold; text-align: right; min-width: 0; overflow-wrap: anywhere; }
        .damage-controls { display: flex; align-items: flex-start; gap: 15px; padding: 5px 0;
            border-top: 1px solid rgba(219,217,210,0.20); }
        .damage-control-labels, .damage-control-selects { display: flex; flex-direction: column; gap: 4px; }
        .damage-control-labels { flex: 0 0 auto; }
        .damage-control-labels .fact-name { height: 24px; line-height: 24px; white-space: nowrap; }
        .damage-control-selects { flex: 0 1 146px; min-width: 0; }
        .damage-select { width: auto; min-width: 0; height: 24px; padding: 2px 6px; font-family: inherit; font-size: 13px; cursor: pointer;
            color: #faf9f5; border: 1px solid rgba(178,170,150,0.76); border-radius: 0; }
        .damage-total { flex: 1 1 0; min-width: 28px; line-height: 24px; font-size: 20px; word-break: break-all; }
        .speed-toggle { width: 100%; cursor: pointer; background-color: transparent; border: 0; border-top: 1px solid rgba(219,217,210,0.20); }
        .speed-toggle:hover { background-color: rgba(222,225,228,0.07); }
        .speed-label { display: flex; align-items: center; gap: 9px; }
        .speed-range { white-space: nowrap; }
        .speed-toggle[aria-expanded="true"] .damage-chevron { transform: rotate(-135deg); }
        .speed-selects { display: flex; gap: 5px; margin: 5px 0; }
        .speed-selects .damage-select { flex: 0 1 122px; min-width: 0; width: 122px; height: 23px; padding: 1px 4px; font-size: 12px; }
        .speed-chart { display: block; width: 100%; height: 216px; }
        .damage-select:focus-visible, .damage-more:focus-visible { outline: 1px solid #c7aa70; }
        /* 原生弹层挂在本页面的 body 下，样式覆盖仅限这份模板。 */
        .aui-select-popup { padding: 0 !important; background-color: #23252a !important; border: 1px solid #817c70 !important; border-radius: 0 !important; }
        .aui-select-option { color: #faf9f5 !important; background-color: #23252a !important; border-bottom: 1px solid rgba(96,95,92,0.72); cursor: pointer !important; }
        .aui-select-option[aria-selected="true"] { color: #15171b !important; background-color: #e3e4e3 !important; font-weight: bold !important; }
        .damage-sources { margin: 0; }
        .damage-source { display: flex; justify-content: space-between; gap: 5px; padding: 1px 0 1px 7px;
            color: #d4d3d0; font-size: 13px; font-style: italic; }
        .damage-source-label { display: flex; align-items: flex-start; gap: 4px; min-width: 0; }
        .damage-source-branch { flex: 0 0 auto; font-style: normal; white-space: nowrap; }
        .damage-source-name { min-width: 0; word-break: break-all; font-style: italic; }
        .damage-source-value { min-width: 0; max-width: 58%; text-align: right; word-break: break-all; font-style: italic; }
        .damage-more { display: flex; align-items: center; justify-content: center;
            width: 26px; height: 21px; margin: 1px 0 2px auto; padding: 0;
            border: 0; border-radius: 0; color: #dadbdc; background-color: transparent; }
        .damage-more:hover { background-color: rgba(222,225,228,0.12); }
        .damage-chevron { width: 8px; height: 8px; border-right: 1px solid #dadbdc;
            border-bottom: 1px solid #dadbdc; transform: rotate(45deg); }
        .damage-more[aria-expanded="true"] .damage-chevron { transform: rotate(-135deg); }
        .damage-stat { border-top: 0; min-height: 24px; padding: 3px 0; }
        .fact-heading { margin-top: 8px; padding: 5px 0; color: #fff; font-size: 16px; font-weight: bold; border-top: 1px solid rgba(219,217,210,0.20); }
        .mobility-row, .damage-row { display: flex; align-items: center; width: 100%; min-height: 24px; }
        .mobility-label, .damage-distance { width: 25%; flex: 0 0 25%; color: #d5d5d3; font-size: 14px; }
        .meter-track { display: flex; align-items: center; flex: 1 1 0; min-width: 0; height: 4px; background-color: rgba(224,223,219,0.22); }
        .meter-fill { height: 4px; background-color: #e0dfd9; }
        .meter-value { width: 31%; flex: 0 0 31%; text-align: right; color: #fff; font-size: 14px; }
        .damage-row { border-bottom: 1px solid rgba(219,217,210,0.12); color: #f2f1ed; }
        .damage-cell { width: 18.75%; flex: 0 0 18.75%; min-width: 0; text-align: center; font-size: 14px; }
        .damage-header .damage-cell, .damage-header .damage-distance { color: #c5c5c3; }
        .ricochet { color: #dfc99b; }
        #aux-actions { margin-top: 10px; }
        #aux-state, #aux-unavailable { font-size: 16px; line-height: 1.3; margin: 5px 0; overflow-wrap: anywhere; }
        .option[aria-current="true"] .option-art { border-left: 3px solid #b69a64; }
        .search { width: 100%; padding: 5px 7px; flex: 0 0 auto; background-color: #202126; color: #fff; border: 0; border-bottom: 1px solid #5b5c60; }
        .empty, .smoke { padding: 7px 8px; background-color: rgba(32,32,38,0.94); color: #e8e8e6; font-size: 12px; }
        .rgb { display: flex; align-items: center; gap: 5px; padding: 4px 0; }
        .rgb input[type=range] { flex: 1 1 0; min-width: 0; }
        .rgb input[type=number] { width: 39px; flex: 0 0 39px; background-color: #101519; color: #fff; border: 1px solid #75818a; }
        #swatch { margin-top: 3px; height: 9px; border: 1px solid #88949d; }
        .footer { position: absolute; left: 1%; right: 1.8%; bottom: 0.8%; height: 40px; }
        .foot { position: absolute; bottom: 0; width: 182px; height: 39px; padding: 3px 8px; font-size: 17px; color: #f1f1ee; border: 1px solid rgba(162,154,136,0.70); box-shadow: 0 0 2px rgba(12,12,16,0.42); }
        #reset-view { left: 0; }
        #close-button { right: 0; }
        .hidden { display: none; }
        .compact .caption, .compact .value, .compact .option-name, .compact .tab, .compact #detail-copy { font-size: 22px; }
        .compact .caption, .compact .load { min-height: 33px; }
        .compact .option { min-height: 39px; }
        .compact .plaque { height: 112px; }
        .compact #vehicle-title, .compact #detail-title { font-size: 25px; }
        .compact .fact-name, .compact .foot, .compact .section-label { font-size: 19px; }
        .compact .damage-controls { gap: 19px; }
        @media (max-height: 520px) {
            .tab, .foot { height: 27px; }
            .caption, .load, .option { min-height: 22px; }
            .plaque { height: 55px; }
        }
    </style>
</head>
<body id="workshop">
    <header class="top"><button id="vehicle-title" type="button"></button><div class="section-label"><translation>gui.ywzj_rvp.workshop.title</translation></div></header>
    <aside id="navigation" class="side">
        <div class="tabs"><button id="profile-tab" class="tab" type="button"><span><translation>screen.vehicle_modding_tool.profile</translation></span><span class="tab-notch"></span></button><button id="equipment-tab" class="tab" type="button"><span><translation>gui.ywzj_rvp.workshop.equipment</translation></span><span class="tab-notch"></span></button></div>
        <div id="slots" class="slots"></div>
    </aside>
    <section id="options" class="option-panel hidden">
        <div id="options-title" class="bar"></div>
        <input id="paint-search" class="search hidden" type="text">
        <div id="choices" class="choices"></div>
        <div id="no-results" class="empty hidden"><translation>screen.vehicle_modding_tool.no_results</translation></div>
        <div id="smoke" class="smoke hidden">
            <div class="rgb"><span>R</span><input id="r-range" type="range" min="0" max="255"><input id="r-value" type="number" min="0" max="255"></div>
            <div class="rgb"><span>G</span><input id="g-range" type="range" min="0" max="255"><input id="g-value" type="number" min="0" max="255"></div>
            <div class="rgb"><span>B</span><input id="b-range" type="range" min="0" max="255"><input id="b-value" type="number" min="0" max="255"></div>
            <div id="swatch"></div>
        </div>
    </section>
    <aside id="detail" class="detail"><div id="detail-title"></div><div id="detail-art" class="detail-art hidden"></div><div id="detail-copy"></div><div id="facts"></div>
        <div id="aux-actions" class="hidden"><div id="aux-unavailable" class="hidden"><translation>gui.ywzj_rvp.auxiliary.preview_unavailable</translation></div><div id="aux-state"></div></div>
    </aside>
    <footer class="footer"><button id="reset-view" class="foot" type="button"><span><translation>gui.ywzj_rvp.workshop.reset</translation></span></button><button id="close-button" class="foot" type="button"><span><translation>gui.done</translation></span></button></footer>
</body>
</html>
