#RVP Common Config
[spawning]
    #When placing a vehicle with the spawn item, automatically add a stack of creative ammo
    #to the vehicle's inventory so it can be used immediately, and instantly refill ALL weapons
    #to full ammo once at the moment the vehicle spawns (skipping long reload times).
    #This refill is a one-time operation at spawn only and will not repeat as ammo is consumed.
    #Default: false
    spawnVehicleWithCreativeAmmo = true

[remoteVehicleRendering]
    #是否启用服务端权威的载具超视距视觉同步。默认：true
    enabled = true
    #是否在载具超视距渲染启用时剔除客户端普通地形雾，避免原生实体载具在 512 格接管边界前被雾墙遮挡。
    #仅影响普通空气雾；水下、熔岩、细雪、失明和黑暗仍保留原版限制。默认：true
    removeTerrainFog = true
    #是否把没有任何成功烘焙 LOD 规则的超视距载具改为 Billboard。
    #该值由服务端随远距载具完整快照强制同步。默认：true
    aggressiveLodBillboard = true
    #是否强制所有超视距载具使用 Billboard；启用后覆盖 aggressiveLodBillboard。
    #该值由服务端随远距载具完整快照强制同步。默认：false
    forceAllVehicleBillboard = false
    #Billboard 图像来源：SLOT_TEXTURE 或 DYNAMIC_SNAPSHOT。
    #该值由服务端随远距载具完整快照强制同步。默认：DYNAMIC_SNAPSHOT
    #Allowed Values: SLOT_TEXTURE, DYNAMIC_SNAPSHOT
    billboardSource = "DYNAMIC_SNAPSHOT"
    #动态快照尚未生成时的显示方式：HIDE、SLOT_TEXTURE 或 MODEL。
    #MODEL 会绘制基础静态高模并受客户端高模预算限制。默认：HIDE
    #Allowed Values: HIDE, SLOT_TEXTURE, MODEL
    dynamicSnapshotWarmupMode = "HIDE"
    #载具超视距授权模式：OFF、RADAR_DETECTED、VEHICLE_OCCUPANTS、ALL_PLAYERS。
    #默认：VEHICLE_OCCUPANTS
    #Allowed Values: OFF, RADAR_DETECTED, VEHICLE_OCCUPANTS, ALL_PLAYERS
    visibilityMode = "VEHICLE_OCCUPANTS"
    #载具超视距同步最大水平距离，单位格。范围：512..65536，默认：4096
    #Range: 512.0 ~ 65536.0
    maxDistance = 4096
    #载具视觉完整集合同步周期，单位 tick。范围：1..200，默认：5
    #Range: 1 ~ 200
    syncIntervalTicks = 5
    #单个玩家每份快照允许的最大载具目标数。范围：0..1024，默认：32
    #Range: 0 ~ 1024
    maxTargetsPerPlayer = 32
    #远距载具区块租约模式：OFF、AI_UAV_ONLY、VISIBLE_TARGETS。
    #默认：VISIBLE_TARGETS
    #Allowed Values: OFF, AI_UAV_ONLY, VISIBLE_TARGETS
    chunkLoadingMode = "VISIBLE_TARGETS"
    #单个维度允许保持区块加载的最大远距载具数。范围：0..1024，默认：32
    #Range: 0 ~ 1024
    maxChunkLoadedVehiclesPerDimension = 32
    #按载具速度规划区块前探路径的 tick 数。范围：0..200，默认：5
    #Range: 0 ~ 200
    chunkLookAheadTicks = 5
    #玩家正在使用载具、进入 SCOPE 观瞄视角且最终 FOV 达到缩放阈值时，
    #是否仅覆盖服务端 Billboard 策略，优先使用普通 LOD、无有效 LOD 时回退基础高模。
    #该值只影响当前客户端，不随服务端远距载具快照同步。默认：true
    scopeZoomPreferModelRendering = true
    #服务端参数：客户端未安装 DH 或关闭 DH 地形渲染时，隐藏离地高度低于该值的超视距载具。
    #单位米（1 米 = 1 格），默认：25；-1 不启用限制，等于阈值时仍允许渲染。
    #随完整快照强制同步；不受客户端本地 common 同名值覆盖，不影响原生追踪实体。
    #Range: > -1
    minHeightAboveGroundWithoutDH = 25

    [remoteVehicleRendering.visibilityByObserverVehicleType]
        #允许该观察者类型看见的目标类型。仅接受 helicopter、aircraft、ground_vehicles。
        helicopter = ["helicopter", "aircraft", "ground_vehicles"]
        #允许该观察者类型看见的目标类型。仅接受 helicopter、aircraft、ground_vehicles。
        aircraft = ["helicopter", "aircraft", "ground_vehicles"]
        #允许该观察者类型看见的目标类型。仅接受 helicopter、aircraft、ground_vehicles。
        ground_vehicles = ["helicopter", "aircraft"]
        #允许该观察者类型看见的目标类型。仅接受 helicopter、aircraft、ground_vehicles。
        walking_players = ["helicopter", "aircraft"]

[vehicleLifecycle]
    #载具残骸保留时间，单位秒；超过该时间后服务端移除残骸。默认：60
    #Range: > 0
    wreckLifetimeSeconds = 60
